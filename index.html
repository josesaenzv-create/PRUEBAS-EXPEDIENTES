                setLoadingMsg('Actualizando parámetros...');
                try {
                    const data = await fetchGAS({
                        action: 'deleteParametro',
                        tipo,
                        valor,
                        sedeAplica: sedeActual,
                        usuario: operadorNombre
                    });
                    if (data.status === 'success' && data.parametros) {
                        aplicarCatalogoParametros(data.parametros);
                        if (tipo === 'ASESOR') setAsesores(asesores.filter(a => a !== valor));
                    }
                } catch (e) {}
                setIsLoading(false);
            };

            const forzarSyncUsuarios = async () => {
                if (!esGerente) return;
                setIsLoading(true);
                setLoadingMsg('Sincronizando sedes, cargos y asesores con el Script Maestro de Usuarios...');
                try {
                    const data = await fetchGAS({ action: 'syncUsuarios', sede: sedeActual });
                    if (data.status === 'success') {
                        if (data.parametros) aplicarCatalogoParametros(data.parametros);
                        alert(`✅ Sincronización completada.\nUsuarios sincronizados: ${data.sync?.usuariosSincronizados || 'OK'}`);
                    }
                } catch (e) {
                    alert('Error al sincronizar con el Script de Usuarios.');
                }
                setIsLoading(false);
            };

            // UI AUXILIARES
            const BadgeEstado = ({estado}) => {
                const colors = {
                    'ACTIVO': 'bg-green-100 text-green-700',
                    'MORA DURA': 'bg-red-100 text-red-700 font-bold',
                    'CANCELADO': 'bg-blue-100 text-blue-700',
                    'LISTA NEGRA': 'bg-slate-800 text-white font-bold',
                    'JUDICIAL': 'bg-purple-100 text-purple-800 font-bold',
                    'REPROGRAMADO': 'bg-amber-100 text-amber-800 font-bold'
                };
                return <span className={`px-2 py-1 rounded text-[10px] font-bold ${colors[estado] || 'bg-slate-200 text-slate-700'}`}>{estado}</span>;
            };

            const ModalHistorial = ({ exp, onClose }) => (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 modal-bg no-print">
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col max-h-[85vh]">
                        <div className="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                            <div><h3 className="font-bold text-slate-800">Historial Inalterable</h3><p className="text-xs text-slate-500">{exp.cliente} | Exp: {exp.id} ({formatearConCeros(exp.id)})</p></div>
                            <button onClick={onClose} className="text-slate-400 hover:text-red-500 p-2"><i className="fa-solid fa-xmark fa-xl"></i></button>
                        </div>
                        <div className="p-6 overflow-y-auto flex-1 space-y-4">
                            {(exp.historial || []).map((h, i) => (
                                <div key={i} className="border-l-2 border-[#59B447] pl-4 relative">
                                    <div className="absolute w-2 h-2 bg-[#59B447] rounded-full -left-[5px] top-1"></div>
                                    <p className="text-[10px] text-slate-400 font-bold">{h.fecha}</p>
                                    <p className="text-xs font-bold text-slate-700 mt-0.5">{h.accion}</p>
                                    <p className="text-xs text-slate-600 mt-1">{h.detalle}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            // MODAL TUTORIAL (i) PARA NUEVOS USUARIOS
            const ModalAyudaTutorial = ({ info, onClose }) => (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 modal-bg no-print">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border-t-4 border-blue-600">
                        <div className="p-4 bg-blue-50 border-b border-blue-100 flex justify-between items-center">
                            <div className="flex items-center gap-2">

                                                return (
                                                    <button
                                                        key={`${b.ini}-${b.fin}`}
                                                        onClick={() => { setBloqueDesde(String(b.ini)); setBloqueHasta(String(b.fin)); }}

                                                            activo ? 'bg-slate-800 text-white border-slate-900 shadow' :
                                                            b.completo ? 'bg-green-100 text-green-800 border-green-300' :
                                                            b.total === 0 ? 'bg-slate-100 text-slate-400 border-slate-200' :
                                                            'bg-white text-slate-700 border-slate-300 hover:bg-blue-50'
                                                        }`}
                                                    >
                                                        <span>{b.ini}-{b.fin}</span>
                                                        <span className={`px-1.5 py-0.2 rounded text-[9px] ${b.completo ? 'bg-green-600 text-white' : 'bg-slate-200 text-slate-700'}`}>

                                                    <span className="font-black">

                                                <button onClick={() => setLiveTableSearch('')} className="absolute right-3 top-2 text-slate-400 hover:text-slate-700">
                                                    <i className="fa-solid fa-xmark"></i>
                                                </button>
                                            )}

                                    </div>

                                    <div className="overflow-x-auto overflow-y-auto flex-1 border border-slate-200 rounded-xl">

                                                <div className="flex gap-2 mt-2 items-center flex-wrap">
                                                    <BadgeEstado estado={expEncontrado.estadoCredito} />
                                                    <span className="px-2 py-1 rounded text-[10px] font-bold bg-slate-100 text-slate-600"><i className="fa-solid fa-user-tie"></i> Titular: {expEncontrado.asesorTitular}</span>

                                                <p className="text-[10px] font-bold text-slate-400 uppercase">Ubicación Física:</p>
                                                <p className={`font-bold text-sm mt-1 ${expEncontrado.ubicacionFisica.includes('CAJA') ? 'text-green-600' : 'text-red-500'}`}>
                                                    <i className={`fa-solid ${expEncontrado.ubicacionFisica.includes('CAJA') ? 'fa-box-archive' : 'fa-handshake'}`}></i> {expEncontrado.ubicacionFisica}

                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}

                            <div className="animate-fade-in space-y-6 no-print">
                                {esAdmin && (

                                        <div>
                                            <p className="text-xs font-black text-amber-900 uppercase"><i className="fa-solid fa-eye mr-1"></i> Modo Consulta Administrativa — Sede {sedeActual}</p>
                                            <p className="text-[11px] text-amber-800">Puedes buscar expedientes por número o nombre y filtrarlos por asesor o estado crediticio. La edición y exportación están reservadas para Gerencia.</p>
                                        </div>

                                                <option value="TODOS">ASESOR: TODOS</option>

                                            </select>
                                        </div>

                                    </div>
                                    <div className="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-[#59B447]">
                                        <p className="text-xs text-slate-500 font-bold uppercase">En Caja (Archivo)</p>
                                        <p className="text-3xl font-bold text-green-600">{listaDash.filter(e => e.ubicacionFisica.includes('CAJA')).length}</p>
                                    </div>
                                    <div className="bg-red-50 p-5 rounded-2xl shadow-sm border-l-4 border-red-500">
                                        <p className="text-xs text-red-500 font-bold uppercase">Prestados a Asesor</p>
                                        <p className="text-3xl font-bold text-red-600">{listaDash.filter(e => !e.ubicacionFisica.includes('CAJA')).length}</p>

                                    <h3 className="font-bold text-slate-800 mb-4 border-b pb-2">
                                        <i className="fa-solid fa-table-list text-blue-500 mr-1"></i>

                                                <tr>
                                                    <th className="p-3">N° Expediente</th>
                                                    <th className="p-3">Nombre del Cliente</th>

                                        <h2 className="text-lg font-black text-slate-800"><i className="fa-solid fa-print text-[#59B447] mr-1"></i> Vista Previa Real en Tamaño A4 (210mm)</h2>
                                        <p className="text-xs text-slate-500">Etiquetas en cola: <span className="font-bold text-blue-600">{ticketsQueue.length}</span> ({printPages.length} hojas A4). Usa el botón verde de PDF para una impresión 100% libre de descuadres.</p>
                                    </div>
                                    <div className="flex flex-wrap gap-2 w-full md:w-auto">
                                        <button onClick={() => { if(confirm("¿Vaciar todas las etiquetas en cola?")) setTicketsQueue([]); }} className="bg-red-50 text-red-600 px-4 py-2.5 rounded-xl font-bold hover:bg-red-100 text-xs">
                                            Vaciar Cola
                                        </button>
                                        <button onClick={descargarTicketsPDFExacto} className="bg-[#59B447] text-white px-5 py-2.5 rounded-xl font-black shadow-md hover:bg-green-600 text-xs flex items-center gap-1.5">
                                            <i className="fa-solid fa-file-pdf text-sm"></i> Descargar PDF A4 Exacto (Recomendado)
                                        </button>
                                        <button onClick={() => window.print()} className="bg-slate-800 text-white px-5 py-2.5 rounded-xl font-bold shadow-md hover:bg-slate-700 text-xs">
                                            <i className="fa-solid fa-print mr-1"></i> Imprimir Directo
                                        </button>
                                    </div>
                                </div>

                                {/* LIENZO A4 REAL (210MM EN PANTALLA Y EN IMPRESORA) */}
                                <div className="print-container w-full overflow-x-auto flex flex-col items-center pb-8">
                                    {printPages.map((page, pageIdx) => (
                                        <div key={pageIdx} className="print-area bg-white mx-auto mb-8 shadow-lg" style={{ pageBreakAfter: pageIdx === printPages.length - 1 ? 'auto' : 'always' }}>
                                            <div className="grid grid-cols-4 w-full border-t-2 border-l-2 border-black">
                                                {page.map((t, idx) => {
                                                    const cellHeight = `${printConfig.ticketHeightMm}mm`;
                                                    if (t.isEmpty) return (
                                                        <div key={`empty-${idx}`} className="ticket-cell flex flex-col border-r-2 border-b-2 border-black bg-white box-border justify-between" style={{ height: cellHeight }}>
                                                            {printConfig.showHeaderSede && <div className="w-full bg-white border-b-2 border-black shrink-0" style={{ height: '4.2mm' }}></div>}
                                                            <div className="flex-1 w-full bg-transparent"></div>
                                                            <div className="w-full bg-slate-50/30 border-t-2 border-black shrink-0" style={{ height: '11.5mm' }}></div>
                                                        </div>
                                                    );

                                                    const qrValue = armarPayloadQR(t);
                                                    const fontOptimo = calcularFontSizeOptimo(t.cliente, printConfig.fontSizeCliente, printConfig.qrPosition);
                                                    const lineasNombre = dividirEnLineasSeguras(t.cliente, 13);
                                                    const codRojo = obtenerCodigoVisibleTicket(t.id);

                                                    return (
                                                        <div key={idx} className="ticket-cell flex flex-col border-r-2 border-b-2 border-black bg-white box-border overflow-hidden justify-between" style={{ height: cellHeight }}>
                                                            {printConfig.showHeaderSede && (
                                                                <div className="w-full bg-white border-b-2 border-black shrink-0 flex items-center justify-between px-1.5" style={{ height: '4.2mm' }}>
                                                                    <span className="text-[7.5px] font-black text-black">{t.sede || sedeActual}</span>
                                                                    <span className="text-[7.5px] font-bold text-slate-500">CREDIBAN</span>
                                                                </div>
                                                            )}

                                                            {printConfig.qrPosition === 'IZQUIERDA' && (
                                                                <div className="flex-1 w-full flex items-center justify-between px-1.5 py-0.5 overflow-hidden gap-1.5">
                                                                    <QRCodeCanvas value={qrValue} size={printConfig.qrSize} />
                                                                    <div className="flex-1 flex flex-col items-center justify-center overflow-hidden">
                                                                        {lineasNombre.map((lin, lIdx) => (
                                                                            <span key={lIdx} className="ticket-name-text font-black text-black uppercase text-center w-full leading-[1.12]" style={{ fontSize: `${fontOptimo}px`, fontFamily: 'Arial, sans-serif' }}>
                                                                                {lin}
                                                                            </span>
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                            )}

                                                            {printConfig.qrPosition === 'DERECHA' && (
                                                                <div className="flex-1 w-full flex items-center justify-between px-1.5 py-0.5 overflow-hidden gap-1.5">
                                                                    <div className="flex-1 flex flex-col items-center justify-center overflow-hidden">
                                                                        {lineasNombre.map((lin, lIdx) => (
                                                                            <span key={lIdx} className="ticket-name-text font-black text-black uppercase text-center w-full leading-[1.12]" style={{ fontSize: `${fontOptimo}px`, fontFamily: 'Arial, sans-serif' }}>
                                                                                {lin}
                                                                            </span>
                                                                        ))}
                                                                    </div>
                                                                    <QRCodeCanvas value={qrValue} size={printConfig.qrSize} />
                                                                </div>
                                                            )}

                                                            {printConfig.qrPosition === 'ARRIBA' && (
                                                                <div className="flex-1 w-full flex flex-col items-center justify-center px-1 py-0.5 overflow-hidden">
                                                                    <QRCodeCanvas value={qrValue} size={Math.min(printConfig.qrSize, 64)} />
                                                                    <span className="ticket-name-text font-black text-black uppercase text-center w-full truncate mt-0.5" style={{ fontSize: `${fontOptimo}px`, fontFamily: 'Arial, sans-serif' }}>
                                                                        {t.cliente}
                                                                    </span>
                                                                </div>
                                                            )}

                                                            {printConfig.qrPosition === 'GIGANTE' && (
                                                                <div className="flex-1 w-full flex items-center justify-center p-0.5 overflow-hidden bg-white">
                                                                    <QRCodeCanvas value={qrValue} size={printConfig.qrSize} />
                                                                </div>
                                                            )}

                                                            <div className="w-full flex flex-col items-center justify-center bg-white border-t-2 border-black shrink-0" style={{ height: '11.5mm' }}>
                                                                <span className="font-black text-red-600 tracking-tighter font-sans" style={{ fontSize: `${printConfig.fontSizeCodigo}px`, lineHeight: '1' }}>
                                                                    {codRojo}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* ===================================================================== */}
                        {/* 6. PANEL GERENCIAL DE PARÁMETROS, CATEGORÍAS Y SYNC DE USUARIOS       */}
                        {/* ===================================================================== */}
                        {view === 'parametros' && esGerente && (
                            <div className="animate-fade-in max-w-5xl mx-auto space-y-6 no-print">
                                <div className="bg-slate-900 text-white p-6 rounded-2xl shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <h2 className="text-lg font-black text-[#59B447] uppercase"><i className="fa-solid fa-users-rays mr-2"></i> Sincronización con Script Maestro de Usuarios</h2>
                                        <p className="text-xs text-slate-300 mt-1">Si agregaste una nueva filial, cajero, administrador o asesor en el Script de Usuarios, sincronízalo aquí en un clic.</p>
                                    </div>
                                    <button onClick={forzarSyncUsuarios} className="bg-[#59B447] text-white font-black px-5 py-3 rounded-xl shadow hover:bg-green-600 text-xs whitespace-nowrap">
                                        <i className="fa-solid fa-rotate mr-1.5"></i> Sincronizar Usuarios y Sedes Ahora
                                    </button>
                                </div>

                                <div className="glass-card p-6 rounded-2xl border-t-4 border-[#59B447]">
                                    <h3 className="font-bold text-slate-800 mb-3">Añadir Nuevo Parámetro o Categorización al Sistema</h3>
                                    <form onSubmit={agregarParametroCloud} className="flex flex-col sm:flex-row gap-3">
                                        <select value={nuevoParamTipo} onChange={e => setNuevoParamTipo(e.target.value)} className="p-3 border rounded-xl bg-slate-50 font-bold text-xs text-slate-700">
                                            <option value="ASESOR">ASESOR DE LA SEDE ({sedeActual})</option>
                                            <option value="ESTADO_CREDITO">CATEGORÍA / ESTADO DE CRÉDITO</option>
                                            <option value="UBICACION">UBICACIÓN FÍSICA / ESTANTE</option>
                                            <option value="SEDE">NUEVA FILIAL / SEDE</option>
                                        </select>
                                        <input type="text" required value={nuevoParamValor} onChange={e => setNuevoParamValor(e.target.value)} placeholder="Escribe el nombre del parámetro..." className="flex-1 p-3 border rounded-xl text-sm font-bold uppercase outline-none focus:ring-2 focus:ring-[#59B447]" />
                                        <button type="submit" className="bg-slate-800 text-white px-6 py-3 rounded-xl font-bold text-xs hover:bg-slate-700">
                                            <i className="fa-solid fa-plus mr-1"></i> Guardar en Nube
                                        </button>
                                    </form>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="glass-card p-5 rounded-2xl">
                                        <h4 className="font-bold text-slate-800 text-sm mb-3 border-b pb-2"><i className="fa-solid fa-user-tie text-[#59B447] mr-1"></i> Asesores ({sedeActual})</h4>
                                        <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                                            {asesores.map(a => (
                                                <div key={a} className="flex justify-between items-center p-2.5 bg-white border rounded-xl text-xs font-bold text-slate-700">
                                                    <span>{a}</span>
                                                    <button onClick={() => eliminarParametroCloud('ASESOR', a)} className="text-red-500 hover:bg-red-50 px-2 py-1 rounded"><i className="fa-solid fa-trash-can"></i></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="glass-card p-5 rounded-2xl">
                                        <h4 className="font-bold text-slate-800 text-sm mb-3 border-b pb-2"><i className="fa-solid fa-tags text-blue-500 mr-1"></i> Categorías de Estado</h4>
                                        <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                                            {estadosDisponibles.map(est => (
                                                <div key={est} className="flex justify-between items-center p-2.5 bg-white border rounded-xl text-xs font-bold text-slate-700">
                                                    <BadgeEstado estado={est} />
                                                    <button onClick={() => eliminarParametroCloud('ESTADO_CREDITO', est)} className="text-red-500 hover:bg-red-50 px-2 py-1 rounded"><i className="fa-solid fa-trash-can"></i></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="glass-card p-5 rounded-2xl">
                                        <h4 className="font-bold text-slate-800 text-sm mb-3 border-b pb-2"><i className="fa-solid fa-building text-purple-600 mr-1"></i> Filiales Activas</h4>
                                        <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                                            {sedesDisponibles.map(s => (
                                                <div key={s} className="flex justify-between items-center p-2.5 bg-white border rounded-xl text-xs font-bold text-slate-700">
                                                    <span><i className="fa-solid fa-location-dot text-slate-400 mr-1.5"></i> {s}</span>
                                                    <span className="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full">ACTIVA</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
