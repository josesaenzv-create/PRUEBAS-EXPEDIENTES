<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Expedientes & QR - CREDIBAN V21 Cloud</title>
    
    <!-- Librerías Core -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Librerías para PDF Nativo (Reportes y Hojas A4 de Tickets QR Exactos) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <!-- Librerías para Escáner QR por Hardware y Generador QR HD -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .tab-active { border-bottom: 3px solid #59B447; color: #59B447; font-weight: bold; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.22s ease-out forwards; }
        .modal-bg { animation: fadeIn 0.18s ease-out forwards; }
        
        .login-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); position: relative; overflow: hidden; }
        .login-bg::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(89,180,71,0.05) 0%, rgba(0,0,0,0) 70%); }

        #qr-reader-box video {
            width: 100% !important;
            border-radius: 12px !important;
            object-fit: cover !important;
        }

        /* Vista previa WYSIWYG exacta a la hoja A4 (Evita que las palabras se partan al imprimir) */
        .print-area {
            width: 210mm !important;
            min-width: 210mm !important;
            max-width: 210mm !important;
            box-sizing: border-box !important;
        }
        .ticket-name-text {
            word-break: normal !important;
            overflow-wrap: normal !important;
            hyphens: none !important;
        }

        @media print {
            @page { size: A4 portrait; margin: 4mm; }
            html, body, #root, main { 
                height: auto !important; min-height: 0 !important; overflow: visible !important; 
                display: block !important; background: white !important; margin: 0 !important; padding: 0 !important;
            }
            .no-print { display: none !important; }
            .print-container { padding: 0 !important; margin: 0 !important; overflow: visible !important; }
            .print-area { 
                margin: 0 auto !important; width: 200mm !important; min-width: 200mm !important; max-width: 200mm !important;
                border-left: 2px solid black !important; border-top: 2px solid black !important;
                box-shadow: none !important; page-break-after: always; box-sizing: border-box !important;
            }
            .text-red-600 { color: #dc2626 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .ticket-cell { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // =========================================================================
        // 1. URL DEL SCRIPT DE BASE DE DATOS DE EXPEDIENTES
        // =========================================================================
        const API_URL = "https://script.google.com/macros/s/AKfycbwHEPrFeiFPsB0z1SsTeO2KKfXoSVcZsjxLbQ_UjREyTEI28edgnZDLGnTB0Z7PqTRs/exec";

        // =========================================================================
        // 2. MOTOR DE AUDIO POTENTE: CAJA REGISTRADORA FUERTE + SIRENA DE ERROR
        // =========================================================================
        let sharedAudioCtx = null;
        const getAudioContext = () => {
            if (!sharedAudioCtx) {
                sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (sharedAudioCtx.state === 'suspended') {
                sharedAudioCtx.resume();
            }
            return sharedAudioCtx;
        };

        const playSound = (type) => {
            try {
                const ctx = getAudioContext();
                const compressor = ctx.createDynamicsCompressor();
                compressor.threshold.setValueAtTime(-12, ctx.currentTime);
                compressor.knee.setValueAtTime(10, ctx.currentTime);
                compressor.ratio.setValueAtTime(12, ctx.currentTime);
                compressor.connect(ctx.destination);

                const playDualTone = (f1, f2, start, duration, wave = 'square', vol = 0.95) => {
                    [f1, f2].forEach(freq => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = wave;
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
                        gain.gain.setValueAtTime(vol, ctx.currentTime + start);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + start + duration);
                        osc.connect(gain);
                        gain.connect(compressor);
                        osc.start(ctx.currentTime + start);
                        osc.stop(ctx.currentTime + start + duration);
                    });
                };

                if (type === 'beep') {
                    // Sonido potente de Caja Registradora ("¡Clin-Beep!" metálico fuerte)
                    playDualTone(2100, 2750, 0, 0.06, 'square', 0.95);
                    playDualTone(2650, 3300, 0.06, 0.14, 'triangle', 0.98);
                    if (navigator.vibrate) navigator.vibrate(45);
                } else if (type === 'duplicate') {
                    // Doble bocina ámbar de "Ya contabilizado"
                    playDualTone(520, 680, 0, 0.16, 'sawtooth', 0.95);
                    playDualTone(420, 560, 0.20, 0.22, 'sawtooth', 0.95);
                    if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
                } else if (type === 'alert') {
                    // Alarma fuerte de ERROR (No existe / Mora Dura / Lista Negra)
                    playDualTone(260, 310, 0, 0.25, 'sawtooth', 0.98);
                    playDualTone(190, 240, 0.28, 0.38, 'sawtooth', 0.98);
                    if (navigator.vibrate) navigator.vibrate([250, 80, 250]);
                }
            } catch (e) {}
        };

        // =========================================================================
        // 3. NORMALIZADOR DUAL DE EXPEDIENTES (RECONOCE "7" Y "001-00007" POR IGUAL)
        // =========================================================================
        const normalizarIdNatural = (raw) => {
            const str = String(raw || '').trim().toUpperCase();
            if (!str) return '';
            const parteFinal = str.includes('-') ? str.split('-').pop() : str;
            const soloNum = parteFinal.replace(/\D/g, '');
            if (!soloNum) return str;
            return String(parseInt(soloNum, 10)); // "001-00007" -> "7" y "7" -> "7"
        };

        const formatearConCeros = (raw) => {
            const nat = normalizarIdNatural(raw);
            const soloNum = nat.replace(/\D/g, '');
            return soloNum ? "001-" + soloNum.padStart(5, '0') : '';
        };

        // Calcula el tamaño de letra ideal para que NINGÚN apellido largo se corte en 50mm
        const calcularFontSizeOptimo = (nombreCompleto, manualSize, qrPos) => {
            if (manualSize > 0) return manualSize;
            const palabras = String(nombreCompleto || '').trim().split(/\s+/);
            const maxPalabra = palabras.reduce((max, p) => Math.max(max, p.length), 0);
            const totalLen = String(nombreCompleto || '').length;

            if (qrPos === 'ARRIBA') return totalLen > 24 ? 8.5 : 10;
            if (maxPalabra >= 12 || totalLen >= 30) return 8.5;
            if (maxPalabra >= 10 || totalLen >= 22) return 9.5;
            if (maxPalabra >= 8 || totalLen >= 16) return 10.5;
            return 11.5;
        };

        const dividirEnLineasSeguras = (nombreCompleto, maxCharsPorLinea = 12) => {
            const palabras = String(nombreCompleto || '').trim().split(/\s+/).filter(Boolean);
            const lineas = [];
            let actual = '';
            palabras.forEach(p => {
                if (!actual) {
                    actual = p;
                } else if ((actual.length + 1 + p.length) <= maxCharsPorLinea) {
                    actual += ' ' + p;
                } else {
                    lineas.push(actual);
                    actual = p;
                }
            });
            if (actual) lineas.push(actual);
            return lineas.slice(0, 4);
        };

        // Clasificador Estricto de Roles
        const clasificarRolSistema = (cargoRaw) => {
            const c = String(cargoRaw || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
            if (c.includes("ASESOR") || c.includes("ANALISTA") || c.includes("PROMOTOR") || c === "TRABAJADOR") return "BLOQUEADO_ASESOR";
            if (c.includes("GERENTE") || c.includes("GERENCIA") || c.includes("DIRECTOR") || c.includes("SUPERADMIN")) return "GERENTE";
            if (c.includes("ADMIN") || c.includes("SUPERVISOR") || c.includes("JEFE") || c.includes("COORDINADOR")) return "ADMINISTRADOR";
            if (c.includes("CAJERO") || c.includes("CAJERA") || c.includes("CAJA") || c.includes("ARCHIVO")) return "CAJERO";
            return "NO_AUTORIZADO";
        };

        // Componente QR HD
        function QRCodeCanvas({ value, size = 72 }) {
            const canvasRef = React.useRef(null);
            React.useEffect(() => {
                if (canvasRef.current && window.QRious) {
                    const hdSize = Math.max(240, size * 3);
                    new window.QRious({
                        element: canvasRef.current,
                        value: value || '001-00000',
                        size: hdSize,
                        level: 'L',
                        background: '#ffffff',
                        foreground: '#000000',
                        padding: Math.round(hdSize * 0.08)
                    });
                }
            }, [value, size]);
            return (
                <div className="bg-white inline-flex items-center justify-center shrink-0" style={{ width: `${size}px`, height: `${size}px` }}>
                    <canvas ref={canvasRef} style={{ width: `${size}px`, height: `${size}px`, imageRendering: 'pixelated' }} />
                </div>
            );
        }

        // Botón de Ayuda (i) para Tutoriales de Nuevos Usuarios
        function HelpButton({ title, steps, onOpen }) {
            return (
                <button
                    type="button"
                    onClick={() => onOpen({ title, steps })}
                    title="Ver guía paso a paso"
                    className="inline-flex items-center justify-center w-5 h-5 rounded-full bg-blue-100 text-blue-700 hover:bg-blue-600 hover:text-white text-[11px] font-black transition-colors ml-1.5 shadow-sm"
                >
                    <i className="fa-solid fa-info"></i>
                </button>
            );
        }

        function App() {
            // =====================================================================
            // ESTADOS DE SEGURIDAD Y ACCESO
            // =====================================================================
            const [isAuth, setIsAuth] = React.useState(false);
            const [isLoading, setIsLoading] = React.useState(false);
            const [loadingMsg, setLoadingMsg] = React.useState('');
            const [loginErrorMsg, setLoginErrorMsg] = React.useState('');
            const [helpModal, setHelpModal] = React.useState(null);

            const [rememberPass, setRememberPass] = React.useState(() => localStorage.getItem('crediban_v21_remember') !== 'false');
            const [showPassLogin, setShowPassLogin] = React.useState(false);
            const [usuarioInput, setUsuarioInput] = React.useState(() => localStorage.getItem('crediban_v21_user') || '');
            const [passwordInput, setPasswordInput] = React.useState(() => {
                return localStorage.getItem('crediban_v21_remember') !== 'false'
                    ? (localStorage.getItem('crediban_v21_pass') || '')
                    : '';
            });

            const [sedesDisponibles, setSedesDisponibles] = React.useState(["HUACHO", "HUARAZ", "ICA", "HUANUCO"]);
            const [estadosDisponibles, setEstadosDisponibles] = React.useState(["ACTIVO", "MORA DURA", "CANCELADO", "LISTA NEGRA", "JUDICIAL", "REPROGRAMADO"]);
            const [ubicacionesDisponibles, setUbicacionesDisponibles] = React.useState(["CAJA (ARCHIVO)", "EN COMITÉ", "AUDITORÍA", "ARCHIVO CENTRAL"]);

            const [sedeActual, setSedeActual] = React.useState(() => localStorage.getItem('crediban_v21_sede') || 'HUACHO');
            const [operadorNombre, setOperadorNombre] = React.useState('');
            const [rolSistema, setRolSistema] = React.useState('');

            const esGerente = rolSistema === 'GERENTE';
            const esAdmin = rolSistema === 'ADMINISTRADOR';
            const esCajero = rolSistema === 'CAJERO';
            const puedeOperarCaja = esCajero || esGerente;
            const puedeExportar = esGerente;
            const puedeEditarBase = esGerente;

            const [view, setView] = React.useState('dashboard');
            const [asesores, setAsesores] = React.useState([]);
            const [expedientes, setExpedientes] = React.useState([]);
            const [ticketsQueue, setTicketsQueue] = React.useState(() => JSON.parse(localStorage.getItem('crediban_tickets_queue')) || []);

            // CONFIGURACIÓN DE IMPRESIÓN A4
            const [printConfig, setPrintConfig] = React.useState(() => {
                const saved = localStorage.getItem('crediban_v21_print_cfg');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) {}
                }
                return {
                    qrSize: 70,                 // 70px cabe perfecto en celda de 52mm dejando 115px para el nombre
                    qrPosition: 'IZQUIERDA',    // Como en tu Imagen 1: QR a la izquierda y nombre a la derecha
                    qrDataMode: 'COMPACTO',     // Sede + Código
                    formatoCodigoRojo: 'CEROS', // 'CEROS' (001-00007) | 'NATURAL' (7)
                    fontSizeCliente: 0,         // 0 = Auto sin cortar palabras
                    fontSizeCodigo: 24,
                    ticketHeightMm: 40,
                    showHeaderSede: true
                };
            });

            React.useEffect(() => {
                localStorage.setItem('crediban_v21_print_cfg', JSON.stringify(printConfig));
            }, [printConfig]);

            // ESTADOS DEL ESCÁNER QR, BUSCADOR EN VIVO Y BLOQUES DE ESTANTE
            const [scanMode, setScanMode] = React.useState('INVENTARIO');
            const [asesorLote, setAsesorLote] = React.useState('');
            const [cameraActive, setCameraActive] = React.useState(false);
            const [camerasList, setCamerasList] = React.useState([]);
            const [selectedCamId, setSelectedCamId] = React.useState('');
            const [torchOn, setTorchOn] = React.useState(false);
            const [scanFeedback, setScanFeedback] = React.useState(null);
            const [scanLog, setScanLog] = React.useState([]);
            const [alertasEscaneo, setAlertasEscaneo] = React.useState([]); // Bitácora de errores para que no se pase ninguno
            const [liveSyncActive, setLiveSyncActive] = React.useState(true);
            const [lastSyncTime, setLastSyncTime] = React.useState('');
            const [lectorFisicoInput, setLectorFisicoInput] = React.useState('');

            // Filtros en la Tabla de Inventario en Vivo (Buscador de nombre + Verificador por Bloques 1 al 50)
            const [liveTableSearch, setLiveTableSearch] = React.useState('');
            const [bloqueTamano, setBloqueTamano] = React.useState(50);
            const [bloqueDesde, setBloqueDesde] = React.useState('');
            const [bloqueHasta, setBloqueHasta] = React.useState('');
            const [soloFaltantesBloque, setSoloFaltantesBloque] = React.useState(false);

            const html5QrInstanceRef = React.useRef(null);
            const lastScannedRef = React.useRef({ code: '', time: 0 });
            const expedientesRef = React.useRef(expedientes);
            const scanModeRef = React.useRef(scanMode);
            const asesorLoteRef = React.useRef(asesorLote);
            const operadorRef = React.useRef(operadorNombre);
            const sedeRef = React.useRef(sedeActual);

            React.useEffect(() => { expedientesRef.current = expedientes; }, [expedientes]);
            React.useEffect(() => { scanModeRef.current = scanMode; }, [scanMode]);
            React.useEffect(() => { asesorLoteRef.current = asesorLote; }, [asesorLote]);
            React.useEffect(() => { operadorRef.current = operadorNombre; }, [operadorNombre]);
            React.useEffect(() => { sedeRef.current = sedeActual; }, [sedeActual]);
            React.useEffect(() => { localStorage.setItem('crediban_tickets_queue', JSON.stringify(ticketsQueue)); }, [ticketsQueue]);

            const fetchGAS = async (payloadObj) => {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payloadObj)
                });
                return await res.json();
            };

            const aplicarCatalogoParametros = (param) => {
                if (!param) return;
                if (Array.isArray(param.sedes) && param.sedes.length > 0) setSedesDisponibles(param.sedes);
                if (Array.isArray(param.estadosCredito) && param.estadosCredito.length > 0) setEstadosDisponibles(param.estadosCredito);
                if (Array.isArray(param.ubicaciones) && param.ubicaciones.length > 0) setUbicacionesDisponibles(param.ubicaciones);
            };

            const getFechaHora = () => {
                const now = new Date();
                const d = String(now.getDate()).padStart(2, '0');
                const m = String(now.getMonth() + 1).padStart(2, '0');
                const y = now.getFullYear();
                const h = String(now.getHours()).padStart(2, '0');
                const min = String(now.getMinutes()).padStart(2, '0');
                return `${d}/${m}/${y}, ${h}:${min}`;
            };

            const getHoyId = () => {
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            };

            // =====================================================================
            // LOGIN SIN SELECTOR DE SEDE + RECORDAR CONTRASEÑA
            // =====================================================================
            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginErrorMsg('');
                if (!usuarioInput.trim()) return setLoginErrorMsg("Ingresa tu usuario.");
                if (!passwordInput.trim()) return setLoginErrorMsg("Ingresa tu contraseña.");

                setIsLoading(true);
                setLoadingMsg('Validando credenciales y detectando sede asignada...');

                try {
                    const data = await fetchGAS({
                        action: 'login',
                        usuario: usuarioInput.trim(),
                        password: passwordInput.trim(),
                        sede: ''
                    });

                    if (data.status !== 'success') {
                        setIsLoading(false);
                        setLoginErrorMsg(data.message || 'Usuario o contraseña incorrectos.');
                        return;
                    }

                    const userObj = data.user || {};
                    const cargoDetectado = String(userObj.cargo || 'NO_AUTORIZADO').toUpperCase();
                    const rolClasificado = clasificarRolSistema(cargoDetectado);

                    if (rolClasificado === 'BLOQUEADO_ASESOR') {
                        playSound('alert');
                        setIsLoading(false);
                        setLoginErrorMsg('⛔ ACCESO DENEGADO: Los Asesores no tienen permiso para ingresar al sistema de expedientes.');
                        return;
                    }

                    if (rolClasificado === 'NO_AUTORIZADO') {
                        playSound('alert');
                        setIsLoading(false);
                        setLoginErrorMsg(`⛔ Cargo sin autorización (${cargoDetectado}): Solo ingresan Cajeros, Administradores y Gerentes.`);
                        return;
                    }

                    localStorage.setItem('crediban_v21_user', usuarioInput.trim());
                    localStorage.setItem('crediban_v21_remember', rememberPass ? 'true' : 'false');
                    if (rememberPass) {
                        localStorage.setItem('crediban_v21_pass', passwordInput.trim());
                    } else {
                        localStorage.removeItem('crediban_v21_pass');
                    }

                    const sedeDetectada = data.sede || userObj.sedeActiva || 'HUACHO';
                    setSedeActual(sedeDetectada);
                    localStorage.setItem('crediban_v21_sede', sedeDetectada);

                    setOperadorNombre(userObj.nombreCorto || userObj.nombre || usuarioInput.toUpperCase());
                    setRolSistema(rolClasificado);

                    if (data.parametros) aplicarCatalogoParametros(data.parametros);
                    if (Array.isArray(data.asesores)) setAsesores(data.asesores);
                    if (Array.isArray(data.data)) setExpedientes(data.data);

                    setLastSyncTime(new Date().toLocaleTimeString());
                    setView(rolClasificado === 'ADMINISTRADOR' ? 'dashboard' : 'escaner');
                    setIsAuth(true);
                } catch (err) {
                    setLoginErrorMsg('❌ Error de conexión con el servidor. Verifica tu conexión a internet.');
                }
                setIsLoading(false);
            };

            const cambiarSedeActiva = async (nuevaSede) => {
                if (!nuevaSede || nuevaSede === sedeActual) return;
                setIsLoading(true);
                setLoadingMsg(`Cargando expedientes de filial ${nuevaSede}...`);
                try {
                    const data = await fetchGAS({
                        action: 'getData',
                        sede: nuevaSede,
                        password: passwordInput,
                        usuario: operadorNombre
                    });
                    if (data.status === 'success') {
                        setSedeActual(nuevaSede);
                        localStorage.setItem('crediban_v21_sede', nuevaSede);
                        setExpedientes(data.data || []);
                        if (Array.isArray(data.asesores)) setAsesores(data.asesores);
                        if (data.parametros) aplicarCatalogoParametros(data.parametros);
                        setScanFeedback(null);
                    }
                } catch (e) {
                    alert('Error al cambiar de sede.');
                }
                setIsLoading(false);
            };

            // SINCRONIZACIÓN EN VIVO CADA 3 SEGUNDOS
            React.useEffect(() => {
                if (!isAuth || !liveSyncActive || (view !== 'escaner' && view !== 'dashboard')) return;
                const timer = setInterval(async () => {
                    try {
                        const data = await fetchGAS({
                            action: 'pollLive',
                            sede: sedeActual,
                            password: passwordInput
                        });
                        if (data.status === 'success' && Array.isArray(data.data)) {
                            setExpedientes(data.data);
                            if (Array.isArray(data.asesores)) setAsesores(data.asesores);
                            if (data.parametros) aplicarCatalogoParametros(data.parametros);
                            setLastSyncTime(new Date().toLocaleTimeString());
                        }
                    } catch (e) {}
                }, 3000);
                return () => clearInterval(timer);
            }, [isAuth, liveSyncActive, view, sedeActual, passwordInput]);

            const syncExpedienteCloud = async (expToSave, silent = false, checkDuplicateInv = false) => {
                if (!silent) {
                    setIsLoading(true);
                    setLoadingMsg('Sincronizando con Google Sheets...');
                }
                try {
                    const data = await fetchGAS({
                        action: 'save',
                        sede: sedeRef.current,
                        usuario: operadorRef.current,
                        password: passwordInput,
                        data: expToSave,
                        checkDuplicateInv
                    });
                    if (!silent) setIsLoading(false);
                    return data;
                } catch (err) {
                    if (!silent) {
                        setIsLoading(false);
                        alert('❌ Error de red al sincronizar el expediente.');
                    }
                    return { status: 'error' };
                }
            };

            // =====================================================================
            // PROCESADOR QR UNIVERSAL: EMPAREJA "001-00007" CON "7" AUTOMÁTICAMENTE
            // =====================================================================
            const procesarLecturaQR = React.useCallback(async (rawText) => {
                if (!rawText) return;
                const clean = String(rawText).trim().toUpperCase();

                const nowMs = Date.now();
                if (lastScannedRef.current.code === clean && (nowMs - lastScannedRef.current.time) < 1300) {
                    return;
                }
                lastScannedRef.current = { code: clean, time: nowMs };

                let idNaturalDetectado = '';
                let clienteQR = '';

                if (clean.includes('|')) {
                    const partes = clean.split('|').map(p => p.trim());
                    const parteCodigo = partes.find(p => /\d+/.test(p)) || partes[1] || partes[0];
                    idNaturalDetectado = normalizarIdNatural(parteCodigo);
                    if (partes.length >= 3) clienteQR = partes[2];
                } else {
                    idNaturalDetectado = normalizarIdNatural(clean);
                }

                if (!idNaturalDetectado || !/\d+/.test(idNaturalDetectado)) {
                    playSound('alert');
                    const msgErr = { hora: getFechaHora(), titulo: 'QR INVÁLIDO', detalle: clean };
                    setAlertasEscaneo(prev => [msgErr, ...prev.slice(0, 9)]);
                    setScanFeedback({ type: 'error', title: '🚨 CÓDIGO QR NO RECONOCIDO', subtitle: `Lectura: ${clean}` });
                    return;
                }

                // BÚSQUEDA DUAL: Empareja tanto si en la base está como "7" o como "001-00007"
                const exp = expedientesRef.current.find(x => normalizarIdNatural(x.id) === idNaturalDetectado);

                if (!exp) {
                    playSound('alert');
                    const codigoMostrar = `${idNaturalDetectado} (${formatearConCeros(idNaturalDetectado)})`;
                    const msgErr = {
                        hora: getFechaHora(),
                        titulo: `NO EXISTE EXP. ${codigoMostrar}`,
                        detalle: clienteQR || 'No registrado en la base de esta sede'
                    };
                    setAlertasEscaneo(prev => [msgErr, ...prev.slice(0, 9)]);
                    setScanFeedback({
                        type: 'error',
                        title: `🚨 EXPEDIENTE ${codigoMostrar} NO EXISTE EN ${sedeRef.current}`,
                        subtitle: clienteQR ? `Etiqueta: ${clienteQR} — Regístralo en Base de Datos` : 'Regístralo primero en Base de Datos'
                    });
                    return;
                }

                const modoActual = scanModeRef.current;
                const asesorSeleccionado = asesorLoteRef.current;
                const cajeroNombre = operadorRef.current;
                const hoySesion = getHoyId();
                const estadoPrevio = JSON.parse(JSON.stringify(exp));

                // MODO 1: INVENTARIO EN VIVO
                if (modoActual === 'INVENTARIO') {
                    if (exp.invSesion === hoySesion && exp.invFecha) {
                        playSound('duplicate');
                        setAlertasEscaneo(prev => [{
                            hora: getFechaHora(),
                            titulo: `DUPLICADO: EXP. ${exp.id}`,
                            detalle: `${exp.cliente} (Ya pasado por ${exp.invCajero})`
                        }, ...prev.slice(0, 9)]);
                        setScanFeedback({
                            type: 'warning',
                            title: `⚠️ YA CONTABILIZADO: EXP. ${exp.id} (${formatearConCeros(exp.id)})`,
                            subtitle: `${exp.cliente} — Escaneado por ${exp.invCajero || 'CAJERO'} (${exp.invFecha})`
                        });
                        return;
                    }

                    const esRestringido = exp.estadoCredito === 'LISTA NEGRA' || exp.estadoCredito === 'MORA DURA';
                    playSound(esRestringido ? 'alert' : 'beep');

                    const horaActual = getFechaHora();
                    const estabaFuera = !exp.ubicacionFisica.includes('CAJA');
                    const nuevoHist = [...(exp.historial || [])];
                    nuevoHist.unshift({
                        fecha: horaActual,
                        accion: 'INVENTARIO QR',
                        detalle: `Verificado en estante por ${cajeroNombre}${estabaFuera ? ' (Retornado automáticamente a Caja)' : ''}`
                    });

                    const actualizado = {
                        ...exp,
                        ubicacionFisica: 'CAJA (ARCHIVO)',
                        fechaUltimoMov: horaActual,
                        invFecha: horaActual,
                        invCajero: cajeroNombre,
                        invSesion: hoySesion,
                        historial: nuevoHist
                    };

                    setExpedientes(prev => prev.map(item => normalizarIdNatural(item.id) === idNaturalDetectado ? actualizado : item));
                    setScanLog(prev => [{ id: exp.id, cliente: exp.cliente, prev: estadoPrevio }, ...prev.slice(0, 29)]);
                    setScanFeedback({
                        type: esRestringido ? 'danger_ok' : 'success',
                        title: `✅ INVENTARIO REGISTRADO: EXP. ${exp.id} (${formatearConCeros(exp.id)})`,
                        subtitle: `${exp.cliente} | Estado: ${exp.estadoCredito}${estabaFuera ? ' | 🔄 Devuelto a CAJA' : ''}`
                    });

                    const resp = await syncExpedienteCloud(actualizado, true, true);
                    if (resp && resp.status === 'duplicate_inv') {
                        playSound('duplicate');
                        setScanFeedback({
                            type: 'warning',
                            title: `⚠️ YA CONTABILIZADO EN OTRO CELULAR: EXP. ${exp.id}`,
                            subtitle: `Registrado por ${resp.invCajero} (${resp.invFecha})`
                        });
                    }
                    return;
                }

                // MODO 2: RETORNO A CAJA
                if (modoActual === 'RETORNO') {
                    playSound('beep');
                    const horaActual = getFechaHora();
                    const ubicacionPrevia = exp.ubicacionFisica;
                    const nuevoHist = [...(exp.historial || [])];
                    nuevoHist.unshift({
                        fecha: horaActual,
                        accion: 'DEVOLUCIÓN QR',
                        detalle: `Retornado físicamente a Caja por ${cajeroNombre} (Antes: ${ubicacionPrevia})`
                    });

                    const actualizado = {
                        ...exp,
                        ubicacionFisica: 'CAJA (ARCHIVO)',
                        fechaUltimoMov: horaActual,
                        historial: nuevoHist
                    };

                    setExpedientes(prev => prev.map(item => normalizarIdNatural(item.id) === idNaturalDetectado ? actualizado : item));
                    setScanLog(prev => [{ id: exp.id, cliente: exp.cliente, prev: estadoPrevio }, ...prev.slice(0, 29)]);
                    setScanFeedback({
                        type: 'success',
                        title: `📥 DEVUELTO A CAJA: EXP. ${exp.id}`,
                        subtitle: `${exp.cliente} (Retornado de: ${ubicacionPrevia})`
                    });
                    syncExpedienteCloud(actualizado, true);
                    return;
                }

                // MODO 3: SALIDA / PRÉSTAMO POR LOTE
                if (modoActual === 'PRESTAMO') {
                    if (!asesorSeleccionado) {
                        playSound('alert');
                        setScanFeedback({
                            type: 'error',
                            title: 'SELECCIONA UN ASESOR PRIMERO',
                            subtitle: 'Elige al asesor en la lista naranja antes de escanear las carpetas'
                        });
                        return;
                    }

                    const esRestringido = exp.estadoCredito === 'LISTA NEGRA' || exp.estadoCredito === 'MORA DURA';
                    playSound(esRestringido ? 'alert' : 'beep');

                    const horaActual = getFechaHora();
                    const prestamoCruzado = !exp.ubicacionFisica.includes('CAJA') && exp.ubicacionFisica !== `CON ASESOR: ${asesorSeleccionado}`;
                    const nuevoHist = [...(exp.historial || [])];
                    nuevoHist.unshift({
                        fecha: horaActual,
                        accion: 'PRÉSTAMO QR',
                        detalle: `Entregado a ${asesorSeleccionado} por ${cajeroNombre}${prestamoCruzado ? ` (Transferido desde ${exp.ubicacionFisica})` : ''}`
                    });

                    const actualizado = {
                        ...exp,
                        ubicacionFisica: `CON ASESOR: ${asesorSeleccionado}`,
                        fechaUltimoMov: horaActual,
                        historial: nuevoHist
                    };

                    setExpedientes(prev => prev.map(item => normalizarIdNatural(item.id) === idNaturalDetectado ? actualizado : item));
                    setScanLog(prev => [{ id: exp.id, cliente: exp.cliente, prev: estadoPrevio }, ...prev.slice(0, 29)]);
                    setScanFeedback({
                        type: esRestringido ? 'danger_ok' : (prestamoCruzado ? 'warning' : 'success'),
                        title: `📤 ENTREGADO A ${asesorSeleccionado}: EXP. ${exp.id}`,
                        subtitle: `${exp.cliente} | Estado: ${exp.estadoCredito}${prestamoCruzado ? ` | ⚠️ Figuraba ${exp.ubicacionFisica}` : ''}`
                    });
                    syncExpedienteCloud(actualizado, true);
                }
            }, []);

            // CÁMARA CONTINUA HTML5-QRCODE
            React.useEffect(() => {
                if (view !== 'escaner' && cameraActive) setCameraActive(false);
            }, [view]);

            React.useEffect(() => {
                let isMounted = true;
                const iniciarEscaner = async () => {
                    if (!cameraActive || view !== 'escaner' || !puedeOperarCaja) return;
                    try {
                        if (html5QrInstanceRef.current && html5QrInstanceRef.current.isScanning) {
                            await html5QrInstanceRef.current.stop();
                            html5QrInstanceRef.current.clear();
                        }
                        if (camerasList.length === 0 && window.Html5Qrcode.getCameras) {
                            try {
                                const devices = await window.Html5Qrcode.getCameras();
                                if (isMounted && devices && devices.length > 0) setCamerasList(devices);
                            } catch (e) {}
                        }

                        const qrReader = new window.Html5Qrcode("qr-reader-box", {
                            experimentalFeatures: { useBarCodeDetectorIfSupported: true },
                            verbose: false
                        });
                        html5QrInstanceRef.current = qrReader;

                        const camConfig = selectedCamId ? { deviceId: { exact: selectedCamId } } : { facingMode: "environment" };
                        await qrReader.start(
                            camConfig,
                            {
                                fps: 25,
                                qrbox: (vw, vh) => {
                                    const side = Math.max(175, Math.floor(Math.min(vw, vh) * 0.80));
                                    return { width: side, height: side };
                                },
                                aspectRatio: 1.0
                            },
                            (decodedText) => procesarLecturaQR(decodedText),
                            () => {}
                        );
                    } catch (err) {
                        if (isMounted) {
                            alert("No se pudo iniciar la cámara. Acepta los permisos de cámara del navegador.");
                            setCameraActive(false);
                        }
                    }
                };
                iniciarEscaner();
                return () => {
                    isMounted = false;
                    setTorchOn(false);
                    if (html5QrInstanceRef.current && html5QrInstanceRef.current.isScanning) {
                        html5QrInstanceRef.current.stop().then(() => html5QrInstanceRef.current.clear()).catch(() => {});
                    }
                };
            }, [cameraActive, view, selectedCamId]);

            const toggleLinterna = async () => {
                if (!html5QrInstanceRef.current || !html5QrInstanceRef.current.isScanning) return;
                try {
                    const nextState = !torchOn;
                    await html5QrInstanceRef.current.applyVideoConstraints({ advanced: [{ torch: nextState }] });
                    setTorchOn(nextState);
                } catch (e) {
                    alert("Este lente no soporta encendido de flash desde el navegador.");
                }
            };

            const deshacerUltimoEscaneo = async () => {
                if (scanLog.length === 0) return;
                const ultimo = scanLog[0];
                const restaurado = ultimo.prev;
                setExpedientes(prev => prev.map(item => normalizarIdNatural(item.id) === normalizarIdNatural(restaurado.id) ? restaurado : item));
                setScanLog(prev => prev.slice(1));
                setScanFeedback({
                    type: 'warning',
                    title: `↩️ ESCANEO DESHECHO: EXP. ${restaurado.id}`,
                    subtitle: `Se restauró el estado anterior de ${restaurado.cliente}`
                });
                await syncExpedienteCloud(restaurado, true);
            };

            const reiniciarInventarioSede = async () => {
                if (!confirm(`¿Iniciar un nuevo arqueo de inventario en ${sedeActual}? Esto pondrá todos los expedientes como PENDIENTES de escanear.`)) return;
                setIsLoading(true);
                setLoadingMsg('Reiniciando contadores de inventario en la sede...');
                try {
                    await fetchGAS({ action: 'resetInventario', sede: sedeActual, usuario: operadorNombre });
                    setExpedientes(prev => prev.map(e => ({ ...e, invFecha: '', invCajero: '', invSesion: '' })));
                    setScanLog([]);
                    setAlertasEscaneo([]);
                    setScanFeedback(null);
                } catch (e) {
                    alert('Error al reiniciar el inventario.');
                }
                setIsLoading(false);
            };

            // =====================================================================
            // CÁLCULO DE BLOQUES DE ESTANTE (EJ. DEL 1 AL 50, 51 AL 100, ETC.)
            // =====================================================================
            const hoySesionId = getHoyId();
            const totalContabilizadosHoy = expedientes.filter(e => e.invSesion === hoySesionId && e.invFecha).length;

            // Determinar el número máximo de expediente en la sede para armar botones de bloques dinámicos
            const maxNumExpediente = React.useMemo(() => {
                let max = 50;
                expedientes.forEach(e => {
                    const n = parseInt(normalizarIdNatural(e.id), 10);
                    if (!isNaN(n) && n > max) max = n;
                });
                return Math.ceil(max / bloqueTamano) * bloqueTamano;
            }, [expedientes, bloqueTamano]);

            const bloquesPredefinidos = React.useMemo(() => {
                const arr = [];
                const limite = Math.min(maxNumExpediente, 2000);
                for (let ini = 1; ini <= limite; ini += bloqueTamano) {
                    const fin = ini + bloqueTamano - 1;
                    const expsEnBloque = expedientes.filter(e => {
                        const n = parseInt(normalizarIdNatural(e.id), 10);
                        return !isNaN(n) && n >= ini && n <= fin;
                    });
                    const listos = expsEnBloque.filter(e => e.invSesion === hoySesionId && e.invFecha).length;
                    arr.push({
                        ini,
                        fin,
                        total: expsEnBloque.length,
                        listos,
                        completo: expsEnBloque.length > 0 && listos === expsEnBloque.length
                    });
                }
                return arr;
            }, [expedientes, maxNumExpediente, bloqueTamano, hoySesionId]);

            // Filtrado en vivo de la tabla de inventario (por Nombre/ID y por Bloque de Estante)
            const expedientesTablaVivo = React.useMemo(() => {
                let lista = [...expedientes];
                const d = parseInt(bloqueDesde, 10);
                const h = parseInt(bloqueHasta, 10);

                if (!isNaN(d) || !isNaN(h)) {
                    const minR = !isNaN(d) ? d : 1;
                    const maxR = !isNaN(h) ? h : 999999;
                    lista = lista.filter(e => {
                        const num = parseInt(normalizarIdNatural(e.id), 10);
                        return !isNaN(num) && num >= minR && num <= maxR;
                    });
                    // Ordenar numéricamente del menor al mayor dentro del bloque
                    lista.sort((a, b) => parseInt(normalizarIdNatural(a.id), 10) - parseInt(normalizarIdNatural(b.id), 10));
                }

                if (soloFaltantesBloque) {
                    lista = lista.filter(e => !(e.invSesion === hoySesionId && e.invFecha));
                }

                if (liveTableSearch.trim() !== '') {
                    const q = liveTableSearch.toUpperCase().trim();
                    const qNat = normalizarIdNatural(q);
                    lista = lista.filter(e => {
                        const idNat = normalizarIdNatural(e.id);
                        return e.cliente.includes(q) || String(e.id).includes(q) || (qNat && idNat === qNat);
                    });
                }
                return lista;
            }, [expedientes, bloqueDesde, bloqueHasta, soloFaltantesBloque, liveTableSearch, hoySesionId]);

            // Detectar qué números exactos faltan escanear dentro del bloque seleccionado
            const resumenBloqueActivo = React.useMemo(() => {
                const d = parseInt(bloqueDesde, 10);
                const h = parseInt(bloqueHasta, 10);
                if (isNaN(d) || isNaN(h) || d > h) return null;

                const enRango = expedientes.filter(e => {
                    const num = parseInt(normalizarIdNatural(e.id), 10);
                    return !isNaN(num) && num >= d && num <= h;
                });
                const escaneados = enRango.filter(e => e.invSesion === hoySesionId && e.invFecha);
                const pendientes = enRango.filter(e => !(e.invSesion === hoySesionId && e.invFecha));

                return {
                    desde: d,
                    hasta: h,
                    totalRegistrados: enRango.length,
                    escaneadosCount: escaneados.length,
                    pendientesCount: pendientes.length,
                    completo: enRango.length > 0 && pendientes.length === 0,
                    listaPendientes: pendientes.map(p => `${normalizarIdNatural(p.id)} (${p.cliente.split(' ')[0]})`)
                };
            }, [expedientes, bloqueDesde, bloqueHasta, hoySesionId]);

            // =====================================================================
            // REGISTRO, CATEGORIZACIÓN Y EDICIÓN DE EXPEDIENTES (DNI = NO IDENTIFICADO)
            // =====================================================================
            const [formInv, setFormInv] = React.useState({ idExp: '', cliente: '', estadoCredito: 'ACTIVO', asesorTitular: '', categoriaExtra: '', generarTicket: true });
            const [editMode, setEditMode] = React.useState(null);
            const [historialVisible, setHistorialVisible] = React.useState(null);
            const csvInputRef = React.useRef(null);

            const registrarExpediente = async (e) => {
                e.preventDefault();
                if (!puedeOperarCaja) return;
                if (!formInv.asesorTitular) return alert("Debes seleccionar un Asesor Titular.");
                if (!formInv.idExp) return alert("Ingresa el N° de Expediente.");
                
                let idNatural = normalizarIdNatural(formInv.idExp);
                if (!idNatural || !/\d+/.test(idNatural)) return alert("El N° de Expediente debe contener números.");
                
                while (expedientes.some(x => normalizarIdNatural(x.id) === idNatural)) {
                    const correccion = prompt(`❌ EXPEDIENTE DUPLICADO.\nEl Expediente N° ${idNatural} (${formatearConCeros(idNatural)}) ya existe en ${sedeActual}.\n\nIngresa el N° correcto:`);
                    if (correccion === null || correccion.trim() === '') return;
                    idNatural = normalizarIdNatural(correccion);
                }

                const nuevo = {
                    id: idNatural, // Se guarda como número natural para coincidir con tu base
                    dni: 'NO IDENTIFICADO',
                    cliente: formInv.cliente.toUpperCase().trim(),
                    estadoCredito: formInv.estadoCredito, 
                    asesorTitular: formInv.asesorTitular,
                    ubicacionFisica: 'CAJA (ARCHIVO)', 
                    fechaUltimoMov: getFechaHora(),
                    invFecha: '',
                    invCajero: '',
                    invSesion: '',
                    categoriaExtra: formInv.categoriaExtra.toUpperCase().trim(),
                    historial: [{ fecha: getFechaHora(), accion: 'CREACIÓN', detalle: `Ingreso inicial a Caja por ${operadorNombre}` }]
                };
                
                setExpedientes([nuevo, ...expedientes]);
                if (formInv.generarTicket) {
                    setTicketsQueue([...ticketsQueue, { id: formatearConCeros(idNatural), idNat: idNatural, cliente: nuevo.cliente, sede: sedeActual }]);
                }
                setFormInv({ idExp: '', cliente: '', estadoCredito: 'ACTIVO', asesorTitular: '', categoriaExtra: '', generarTicket: formInv.generarTicket });
                
                await syncExpedienteCloud(nuevo);
                playSound('beep');
                alert(`✅ Expediente N° ${idNatural} registrado en la nube.`);
            };

            const guardarEdicionGerencial = async (expActual) => {
                if (!esGerente || !editMode) return;
                setIsLoading(true);
                setLoadingMsg('Actualizando categorización y datos del expediente...');
                try {
                    const data = await fetchGAS({
                        action: 'editarCategorizacion',
                        sede: sedeActual,
                        id: expActual.id,
                        cliente: editMode.nuevoCliente,
                        estadoCredito: editMode.nuevoEstado,
                        asesorTitular: editMode.nuevoAsesor,
                        ubicacionFisica: editMode.nuevaUbicacion,
                        categoriaExtra: editMode.nuevaCatExtra,
                        usuario: operadorNombre
                    });
                    if (data.status === 'success') {
                        const ahora = getFechaHora();
                        const nuevoHist = [...(expActual.historial || [])];
                        nuevoHist.unshift({
                            fecha: ahora,
                            accion: `EDICIÓN GERENCIAL (${operadorNombre})`,
                            detalle: `Estado: ${editMode.nuevoEstado} | Titular: ${editMode.nuevoAsesor} | Ubic: ${editMode.nuevaUbicacion}`
                        });
                        const actualizado = {
                            ...expActual,
                            cliente: editMode.nuevoCliente.toUpperCase(),
                            estadoCredito: editMode.nuevoEstado,
                            asesorTitular: editMode.nuevoAsesor,
                            ubicacionFisica: editMode.nuevaUbicacion,
                            categoriaExtra: editMode.nuevaCatExtra.toUpperCase(),
                            fechaUltimoMov: ahora,
                            historial: nuevoHist
                        };
                        setExpedientes(expedientes.map(x => normalizarIdNatural(x.id) === normalizarIdNatural(expActual.id) ? actualizado : x));
                        setEditMode(null);
                    } else {
                        alert(`❌ Error: ${data.message}`);
                    }
                } catch (e) {
                    alert('❌ Error al actualizar el expediente.');
                }
                setIsLoading(false);
            };

            // =====================================================================
            // BUSCADOR MANUAL DE PRÉSTAMOS / DEVOLUCIONES
            // =====================================================================
            const [movBusqueda, setMovBusqueda] = React.useState('');
            const [sugerencias, setSugerencias] = React.useState([]);
            const [expEncontrado, setExpEncontrado] = React.useState(null);

            const handleLiveSearch = (e) => {
                const val = e.target.value.toUpperCase();
                setMovBusqueda(val);
                if (val.length < 1) { setSugerencias([]); return; }
                const termNat = normalizarIdNatural(val);
                
                const matches = expedientes.filter(exp => {
                    const idNat = normalizarIdNatural(exp.id);
                    return exp.cliente.includes(val) || idNat === termNat || idNat.includes(termNat);
                });
                setSugerencias(matches.slice(0, 6));
            };

            const seleccionarExpediente = (exp) => { setExpEncontrado(exp); setMovBusqueda(''); setSugerencias([]); };

            const prestarExpediente = async (quienPresta) => {
                if (!puedeOperarCaja) return;
                if (!quienPresta) return alert("Selecciona a quién se entrega el expediente.");
                const expActualizado = { ...expEncontrado, ubicacionFisica: `CON ASESOR: ${quienPresta}`, fechaUltimoMov: getFechaHora() };
                expActualizado.historial = [{ fecha: getFechaHora(), accion: 'PRÉSTAMO', detalle: `Entregado físico a ${quienPresta} por ${operadorNombre}` }, ...(expEncontrado.historial || [])];
                setExpedientes(expedientes.map(e => normalizarIdNatural(e.id) === normalizarIdNatural(expActualizado.id) ? expActualizado : e));
                setExpEncontrado(null);
                await syncExpedienteCloud(expActualizado);
                playSound('beep');
                alert(`✅ Expediente prestado a ${quienPresta}`);
            };

            const devolverCaja = async (ubicacionDestino = 'CAJA (ARCHIVO)') => {
                if (!puedeOperarCaja) return;
                const expActualizado = { ...expEncontrado, ubicacionFisica: ubicacionDestino, fechaUltimoMov: getFechaHora() };
                expActualizado.historial = [{ fecha: getFechaHora(), accion: 'DEVOLUCIÓN', detalle: `Retornado a ${ubicacionDestino} por ${operadorNombre}` }, ...(expEncontrado.historial || [])];
                setExpedientes(expedientes.map(e => normalizarIdNatural(e.id) === normalizarIdNatural(expActualizado.id) ? expActualizado : e));
                setExpEncontrado(null);
                await syncExpedienteCloud(expActualizado);
                playSound('beep');
                alert(`✅ Expediente retornado a ${ubicacionDestino}.`);
            };

            // =====================================================================
            // FILTROS Y BUSCADOR DE SEDE (DASHBOARD / ADMINISTRADORES / GERENTES)
            // =====================================================================
            const [dashSearchQuery, setDashSearchQuery] = React.useState('');
            const [dashFilterAsesor, setDashFilterAsesor] = React.useState('TODOS');
            const [dashFilterEstado, setDashFilterEstado] = React.useState('TODOS');
            const [dashFiltroUbicacion, setDashFiltroUbicacion] = React.useState('TODOS');
            const [dashFiltroInv, setDashFiltroInv] = React.useState('TODOS');
            const [modalReporte, setModalReporte] = React.useState(false);

            let listaDash = expedientes;
            if (dashSearchQuery.trim() !== '') {
                const q = dashSearchQuery.toUpperCase().trim();
                const qNat = normalizarIdNatural(q);
                listaDash = listaDash.filter(e => {
                    const idNat = normalizarIdNatural(e.id);
                    return e.cliente.includes(q) || String(e.id).includes(q) || (qNat && idNat.includes(qNat));
                });
            }
            if (dashFilterAsesor !== 'TODOS') listaDash = listaDash.filter(e => e.asesorTitular === dashFilterAsesor);
            if (dashFilterEstado !== 'TODOS') listaDash = listaDash.filter(e => e.estadoCredito === dashFilterEstado);
            if (dashFiltroUbicacion === 'CAJA') listaDash = listaDash.filter(e => e.ubicacionFisica.includes('CAJA'));
            if (dashFiltroUbicacion === 'CAMPO') listaDash = listaDash.filter(e => !e.ubicacionFisica.includes('CAJA'));
            if (dashFiltroInv === 'CONTABILIZADO') listaDash = listaDash.filter(e => e.invSesion === hoySesionId && e.invFecha);
            if (dashFiltroInv === 'FALTANTE') listaDash = listaDash.filter(e => !(e.invSesion === hoySesionId && e.invFecha));

            // EXPORTACIÓN CSV Y PDF DE REPORTES (SOLO GERENTES)
            const exportarCSV = (soloSeleccionFiltrada = false) => {
                if (!puedeExportar) return alert("⛔ Solo los Gerentes tienen autorización para exportar registros.");
                const fuente = soloSeleccionFiltrada ? listaDash : expedientes;
                if (fuente.length === 0) return alert("No hay datos para exportar.");
                const now = new Date();
                const fileName = `${now.getDate()}-${now.getMonth() + 1}-${now.getFullYear()} - EXPEDIENTES_${sedeActual}.csv`;

                let csv = "ID_Expediente,DNI,Cliente,Estado_Credito,Asesor_Titular,Ubicacion_Fisica,Fecha_Ultimo_Movimiento,Inventario_Fecha,Inventario_Cajero,Categoria_Extra,Historial_JSON\n";
                fuente.forEach(e => { 
                    const histStr = JSON.stringify(e.historial || []).replace(/"/g, '""');
                    csv += `"${e.id}","NO IDENTIFICADO","${e.cliente}","${e.estadoCredito}","${e.asesorTitular}","${e.ubicacionFisica}","${e.fechaUltimoMov}","${e.invFecha || ''}","${e.invCajero || ''}","${e.categoriaExtra || ''}","${histStr}"\n`; 
                });
                const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName; a.click();
            };

            const generarReportePDF = (tipoReporte) => {
                if (!puedeExportar) return alert("⛔ Solo los Gerentes tienen autorización para exportar reportes PDF.");
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                doc.setFont("georgia", "bold"); doc.setTextColor(89, 180, 71); doc.setFontSize(22);
                doc.text("CREDIBAN", 14, 20);
                doc.setFont("helvetica", "normal"); doc.setTextColor(100, 100, 100); doc.setFontSize(9);
                doc.text(`Reporte Oficial de Expedientes (${sedeActual}) - Exportado por Gerencia (${operadorNombre}): ${getFechaHora()}`, 14, 26);
                
                doc.setTextColor(40, 40, 40); doc.setFontSize(10); doc.setFont("helvetica", "bold");
                let titulo = `Filtros: Asesor: ${dashFilterAsesor} | Estado: ${dashFilterEstado} | Ubicación: ${dashFiltroUbicacion} | Inv: ${dashFiltroInv}`;
                doc.text(titulo, 14, 33);

                if (tipoReporte === 'DETALLADO') {
                    const tableData = listaDash.map(e => [
                        e.id,
                        e.cliente,
                        e.estadoCredito,
                        e.asesorTitular,
                        e.ubicacionFisica,
                        (e.invSesion === hoySesionId && e.invFecha) ? `REGISTRADO (${e.invCajero})` : 'PENDIENTE'
                    ]);
                    doc.autoTable({
                        startY: 38, head: [['N° EXP', 'CLIENTE', 'ESTADO', 'TITULAR', 'UBICACIÓN FÍSICA', 'INVENTARIO HOY']],
                        body: tableData, theme: 'grid', styles: { fontSize: 8 }, headStyles: { fillColor: [89, 180, 71] }
                    });
                } else { 
                    doc.autoTable({
                        startY: 38, head: [['MÉTRICA ESTADÍSTICA DE LA SELECCIÓN', 'CANTIDAD EXACTA']],
                        body: [
                            ['Total de Expedientes en esta selección', listaDash.length],
                            ['Resguardados físicamente en Caja', listaDash.filter(e => e.ubicacionFisica.includes('CAJA')).length],
                            ['Prestados / En Campo (Fuera de Caja)', listaDash.filter(e => !e.ubicacionFisica.includes('CAJA')).length],
                            ['Estado Crediticio: ACTIVO', listaDash.filter(e => e.estadoCredito === 'ACTIVO').length],
                            ['Estado Crediticio: MORA DURA / LISTA NEGRA', listaDash.filter(e => e.estadoCredito === 'MORA DURA' || e.estadoCredito === 'LISTA NEGRA').length],
                            ['Inventario QR Registrado Hoy', listaDash.filter(e => e.invSesion === hoySesionId && e.invFecha).length]
                        ], theme: 'grid', styles: { fontSize: 10 }, headStyles: { fillColor: [89, 180, 71] }
                    });
                }
                doc.save(`Reporte_Crediban_${sedeActual}_${tipoReporte}_${Date.now()}.pdf`);
                setModalReporte(false);
            };

            const parseCSVLine = (line) => {
                const result = []; let current = ''; let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        if (inQuotes && line[i+1] === '"') { current += '"'; i++; } 
                        else { inQuotes = !inQuotes; }
                    }
                    else if ((char === ',' || char === ';') && !inQuotes) { result.push(current.trim()); current = ''; }
                    else current += char;
                }
                result.push(current.trim());
                return result.map(s => s.replace(/^"|"$/g, '').trim());
            };

            const importarCSV = async (e) => {
                if (!puedeOperarCaja) return;
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    const lines = evt.target.result.split('\n');
                    let count = 0; let nuevos = [...expedientes]; let nuevosAsesores = [...asesores];
                    let listaParaLaNube = [];

                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        const cols = parseCSVLine(lines[i]);
                        if (cols.length >= 2) {
                            const idNatural = normalizarIdNatural(cols[0]);
                            // Si el CSV tiene 5+ columnas (ID, DNI, Cliente, Estado, Asesor) o 4 columnas sin DNI (ID, Cliente, Estado, Asesor)
                            const tieneColDNI = cols.length >= 5;
                            const cliente = (tieneColDNI ? cols[2] : cols[1] || '').toUpperCase().trim();
                            const estado = (tieneColDNI ? cols[3] : cols[2] || 'ACTIVO').toUpperCase().trim();
                            const asesor = (tieneColDNI ? cols[4] : cols[3] || 'SIN ASIGNAR').toUpperCase().trim();
                            const ubicacionFisica = (tieneColDNI && cols[5] ? cols[5] : 'CAJA (ARCHIVO)').toUpperCase().trim();
                            const fechaUltimoMov = getFechaHora();

                            if (idNatural && cliente && !nuevos.some(x => normalizarIdNatural(x.id) === idNatural)) {
                                const exp = {
                                    id: idNatural,
                                    dni: 'NO IDENTIFICADO',
                                    cliente,
                                    estadoCredito: estado || 'ACTIVO',
                                    asesorTitular: asesor,
                                    ubicacionFisica,
                                    fechaUltimoMov,
                                    historial: [{ fecha: fechaUltimoMov, accion: 'MIGRACIÓN CSV', detalle: `Cargado por ${operadorNombre}` }],
                                    invFecha: '', invCajero: '', invSesion: '', categoriaExtra: ''
                                };
                                nuevos.push(exp);
                                listaParaLaNube.push(exp);
                                count++;
                                if (asesor && !nuevosAsesores.includes(asesor)) nuevosAsesores.push(asesor);
                            }
                        }
                    }
                    setExpedientes(nuevos); setAsesores(nuevosAsesores);
                    if (listaParaLaNube.length > 0) {
                        setIsLoading(true);
                        setLoadingMsg('Subiendo lote masivo a Google Sheets...');
                        await fetchGAS({ action: 'bulkSave', sede: sedeActual, usuario: operadorNombre, data: listaParaLaNube });
                        setIsLoading(false);
                        alert(`✅ Carga Exitosa: Se migraron ${count} expedientes a ${sedeActual} (DNI rellenado con NO IDENTIFICADO).`);
                    }
                };
                reader.readAsText(file); e.target.value = '';
            };

            // =====================================================================
            // GENERADOR DE TICKETS QR + EXPORTADOR NATIVO A PDF A4 (SIN DESCUADRES)
            // =====================================================================
            const [manualId, setManualId] = React.useState('');
            const [manualCliente, setManualCliente] = React.useState('');
            const [rangoDesde, setRangoDesde] = React.useState('');
            const [rangoHasta, setRangoHasta] = React.useState('');
            const [excelPasteText, setExcelPasteText] = React.useState('');

            const obtenerCodigoVisibleTicket = (idRaw) => {
                return printConfig.formatoCodigoRojo === 'NATURAL'
                    ? normalizarIdNatural(idRaw)
                    : formatearConCeros(idRaw);
            };

            const armarPayloadQR = (ticket) => {
                const sedeT = ticket.sede || sedeActual;
                const codFormal = formatearConCeros(ticket.id);
                if (printConfig.qrDataMode === 'MINIMO') return codFormal;
                if (printConfig.qrDataMode === 'COMPACTO') return `${sedeT}|${codFormal}`;
                return `${sedeT}|${codFormal}|${ticket.cliente}`;
            };

            const agregarTicketManual = (e) => {
                e.preventDefault();
                if (!manualId || !manualCliente) return;
                const idNat = normalizarIdNatural(manualId);
                if (!idNat) return alert("El N° de Expediente debe contener números.");
                setTicketsQueue([...ticketsQueue, { id: formatearConCeros(idNat), idNat, cliente: manualCliente.toUpperCase().trim(), sede: sedeActual }]);
                setManualId(''); setManualCliente('');
            };

            const cargarTicketsDesdeBase = (soloRango = false) => {
                if (expedientes.length === 0) return alert("No hay expedientes en la base de esta sede.");
                let filtrados = [...expedientes];
                if (soloRango) {
                    const d = parseInt(rangoDesde.replace(/\D/g, ''), 10) || 1;
                    const h = parseInt(rangoHasta.replace(/\D/g, ''), 10) || 999999;
                    filtrados = filtrados.filter(e => {
                        const num = parseInt(normalizarIdNatural(e.id), 10);
                        return !isNaN(num) && num >= d && num <= h;
                    });
                }
                if (filtrados.length === 0) return alert("Ningún expediente coincide con ese rango.");
                filtrados.sort((a, b) => parseInt(normalizarIdNatural(a.id), 10) - parseInt(normalizarIdNatural(b.id), 10));
                const nuevosTickets = filtrados.map(e => ({ id: formatearConCeros(e.id), idNat: normalizarIdNatural(e.id), cliente: e.cliente, sede: sedeActual }));
                setTicketsQueue([...ticketsQueue, ...nuevosTickets]);
                alert(`✅ Se cargaron ${nuevosTickets.length} etiquetas QR a la cola de impresión.`);
            };

            const procesarPegadoMasivoExcel = () => {
                if (!excelPasteText.trim()) return;
                const lineas = excelPasteText.trim().split('\n');
                const generados = [];
                lineas.forEach(l => {
                    const partes = l.split(/\t|,|;/).map(s => s.trim()).filter(Boolean);
                    if (partes.length >= 2) {
                        const idNat = normalizarIdNatural(partes[0]);
                        const cli = partes.slice(1).join(' ').toUpperCase();
                        if (idNat && cli) generados.push({ id: formatearConCeros(idNat), idNat, cliente: cli, sede: sedeActual });
                    }
                });
                if (generados.length === 0) return alert("Pega al menos 2 columnas desde Excel: N° Expediente y Nombre del Cliente.");
                setTicketsQueue([...ticketsQueue, ...generados]);
                setExcelPasteText('');
                alert(`✅ Se generaron ${generados.length} etiquetas QR listas para imprimir.`);
            };

            // DESCARGAR TICKETS DIRECTAMENTE EN UN PDF A4 VECTORIAL EXACTO (SOLUCIÓN DEFINITIVA A IMAGEN 2)
            const descargarTicketsPDFExacto = () => {
                if (ticketsQueue.length === 0) return alert("Primero añade etiquetas a la cola de impresión.");
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

                const marginX = 5;
                const marginY = 6;
                const colWidth = 50; // 4 columnas x 50mm = 200mm (centrado en A4 de 210mm)
                const rowHeight = Math.min(46, Math.max(36, printConfig.ticketHeightMm || 40));

                printPages.forEach((page, pageIndex) => {
                    if (pageIndex > 0) doc.addPage();

                    page.forEach((t, idx) => {
                        const col = idx % 4;
                        const row = Math.floor(idx / 4);
                        const x = marginX + col * colWidth;
                        const y = marginY + row * rowHeight;

                        // Borde exterior de la celda
                        doc.setDrawColor(0, 0, 0);
                        doc.setLineWidth(0.45);
                        doc.rect(x, y, colWidth, rowHeight);

                        const headerH = printConfig.showHeaderSede ? 4.5 : 0;
                        const footerH = 11.5;
                        const bodyY = y + headerH;
                        const bodyH = rowHeight - headerH - footerH;

                        // Barra superior de Sede
                        if (printConfig.showHeaderSede) {
                            doc.line(x, y + headerH, x + colWidth, y + headerH);
                            if (!t.isEmpty) {
                                doc.setFont("helvetica", "bold");
                                doc.setFontSize(6.5);
                                doc.setTextColor(0, 0, 0);
                                doc.text(String(t.sede || sedeActual), x + 1.5, y + 3.2);
                                doc.setTextColor(110, 110, 110);
                                doc.text("CREDIBAN", x + colWidth - 1.5, y + 3.2, { align: "right" });
                            }
                        }

                        // Línea divisoria del código rojo inferior
                        doc.line(x, y + rowHeight - footerH, x + colWidth, y + rowHeight - footerH);

                        if (!t.isEmpty) {
                            // Generar imagen QR de alta definición en memoria
                            const qrCanvas = document.createElement('canvas');
                            new window.QRious({
                                element: qrCanvas,
                                value: armarPayloadQR(t),
                                size: 300,
                                level: 'L',
                                background: '#ffffff',
                                foreground: '#000000',
                                padding: 20
                            });
                            const qrDataUrl = qrCanvas.toDataURL('image/png');

                            // Convertir tamaño px a mm proporcional para que quepa perfecto en la celda de 50mm
                            const qrMm = Math.min(bodyH - 1.5, Math.max(15, (printConfig.qrSize / 70) * 19.5));

                            if (printConfig.qrPosition === 'IZQUIERDA' || printConfig.qrPosition === 'DERECHA') {
                                const qrX = printConfig.qrPosition === 'IZQUIERDA' ? (x + 1.2) : (x + colWidth - qrMm - 1.2);
                                const qrY = bodyY + (bodyH - qrMm) / 2;
                                doc.addImage(qrDataUrl, 'PNG', qrX, qrY, qrMm, qrMm);

                                // Área libre para el Nombre del Cliente (sin partir palabras jamás)
                                const textAreaX = printConfig.qrPosition === 'IZQUIERDA' ? (x + qrMm + 1.8) : (x + 1.5);
                                const textAreaW = colWidth - qrMm - 3.2;
                                const textCenterX = textAreaX + (textAreaW / 2);

                                doc.setFont("helvetica", "bold");
                                doc.setTextColor(0, 0, 0);

                                // Auto-ajuste de fuente para que ninguna palabra exceda textAreaW
                                let fontPt = printConfig.fontSizeCliente > 0 ? (printConfig.fontSizeCliente * 0.72) : 9.5;
                                doc.setFontSize(fontPt);
                                let lineas = doc.splitTextToSize(String(t.cliente || ''), textAreaW);

                                while ((lineas.length > 4 || palabrasCortadas(String(t.cliente || ''), textAreaW, doc)) && fontPt > 6.2) {
                                    fontPt -= 0.5;
                                    doc.setFontSize(fontPt);
                                    lineas = doc.splitTextToSize(String(t.cliente || ''), textAreaW);
                                }

                                const lineHeightMm = fontPt * 0.40;
                                const totalTextH = lineas.length * lineHeightMm;
                                let startTextY = bodyY + (bodyH - totalTextH) / 2 + (lineHeightMm * 0.78);

                                lineas.slice(0, 4).forEach((lin, lIdx) => {
                                    doc.text(lin, textCenterX, startTextY + (lIdx * lineHeightMm), { align: "center" });
                                });
                            } else if (printConfig.qrPosition === 'ARRIBA') {
                                const qrSmall = Math.min(qrMm, bodyH - 6);
                                doc.addImage(qrDataUrl, 'PNG', x + (colWidth - qrSmall) / 2, bodyY + 0.8, qrSmall, qrSmall);
                                doc.setFont("helvetica", "bold");
                                doc.setFontSize(7.5);
                                doc.setTextColor(0, 0, 0);
                                const lin = doc.splitTextToSize(String(t.cliente || ''), colWidth - 3);
                                doc.text(lin[0] || '', x + colWidth / 2, bodyY + qrSmall + 3.8, { align: "center" });
                            } else {
                                // GIGANTE
                                const qrBig = Math.min(colWidth - 4, bodyH - 1.5);
                                doc.addImage(qrDataUrl, 'PNG', x + (colWidth - qrBig) / 2, bodyY + (bodyH - qrBig) / 2, qrBig, qrBig);
                            }

                            // Código Rojo Inferior
                            doc.setFont("helvetica", "bold");
                            doc.setFontSize(Math.min(22, (printConfig.fontSizeCodigo || 24) * 0.78));
                            doc.setTextColor(220, 38, 38);
                            const codMostrar = obtenerCodigoVisibleTicket(t.id);
                            doc.text(codMostrar, x + colWidth / 2, y + rowHeight - (footerH / 2) + 2.5, { align: "center" });
                        }
                    });
                });

                doc.save(`Tickets_QR_${sedeActual}_${Date.now()}.pdf`);
            };

            const palabrasCortadas = (nombre, maxW, doc) => {
                const palabras = nombre.split(/\s+/);
                return palabras.some(p => doc.getTextWidth(p) > maxW);
            };

            const processTicketsForPrint = () => {
                const paddedQueue = [...ticketsQueue];
                const rem = paddedQueue.length % 24;
                if (rem > 0 || paddedQueue.length === 0) {
                    const toAdd = paddedQueue.length === 0 ? 24 : 24 - rem;
                    for (let i = 0; i < toAdd; i++) paddedQueue.push({ isEmpty: true });
                }
                const pages = [];
                for (let i = 0; i < paddedQueue.length; i += 24) pages.push(paddedQueue.slice(i, i + 24));
                return pages;
            };
            const printPages = processTicketsForPrint();

            // =====================================================================
            // PARÁMETROS DEL SISTEMA (GERENCIA)
            // =====================================================================
            const [nuevoParamValor, setNuevoParamValor] = React.useState('');
            const [nuevoParamTipo, setNuevoParamTipo] = React.useState('ASESOR');

            const agregarParametroCloud = async (e) => {
                e.preventDefault();
                if (!esGerente || !nuevoParamValor.trim()) return;
                setIsLoading(true);
                setLoadingMsg(`Agregando ${nuevoParamTipo} al sistema...`);
                try {
                    const data = await fetchGAS({
                        action: nuevoParamTipo === 'SEDE' ? 'crearSede' : 'addParametro',
                        tipo: nuevoParamTipo,
                        valor: nuevoParamValor.toUpperCase().trim(),
                        nuevaSede: nuevoParamValor.toUpperCase().trim(),
                        sedeAplica: nuevoParamTipo === 'ASESOR' ? sedeActual : 'GLOBAL',
                        usuario: operadorNombre
                    });
                    if (data.status === 'success') {
                        if (data.parametros) aplicarCatalogoParametros(data.parametros);
                        if (nuevoParamTipo === 'ASESOR' && !asesores.includes(nuevoParamValor.toUpperCase().trim())) {
                            setAsesores([...asesores, nuevoParamValor.toUpperCase().trim()]);
                        }
                        setNuevoParamValor('');
                    }
                } catch (e) {
                    alert('Error al guardar parámetro.');
                }
                setIsLoading(false);
            };

            const eliminarParametroCloud = async (tipo, valor) => {
                if (!esGerente) return;
                if (!confirm(`¿Deshabilitar "${valor}" de ${tipo}?`)) return;
                setIsLoading(true);
