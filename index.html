                                            <button type="submit" className="w-full bg-[#59B447] text-white py-2.5 rounded-lg font-bold shadow hover:bg-green-600 mt-2">Registrar en {sedeActual}</button>
                                        </form>
                                    </div>

                                    {esGerente && (
                                        <div className="bg-orange-50 border border-orange-200 p-5 rounded-2xl shadow-sm">
                                            <h3 className="font-bold text-orange-800 mb-2"><i className="fa-solid fa-cloud-arrow-up"></i> Carga Masiva CSV (Gerencia)</h3>
                                            <p className="text-[10px] text-orange-700 mb-3">Importa lotes de expedientes en formato CSV directamente a la filial {sedeActual}.</p>
                                            <button onClick={() => csvInputRef.current.click()} className="w-full bg-orange-500 text-white py-2 rounded-lg font-bold shadow hover:bg-orange-600 text-xs">Seleccionar Archivo CSV</button>
                                        </div>
                                    )}
                                </div>

                                <div className="xl:col-span-3 glass-card p-6 rounded-2xl h-[800px] flex flex-col">
                                    <div className="flex justify-between items-center mb-4 border-b pb-2">
                                        <h3 className="font-bold text-slate-800">Base de Expedientes — {sedeActual} ({expedientes.length})</h3>
                                        {!esGerente && <span className="text-[10px] bg-slate-100 text-slate-500 px-2.5 py-1 rounded font-bold">La edición de expedientes creados requiere perfil Gerencial</span>}
                                    </div>
                                    <div className="overflow-x-auto overflow-y-auto flex-1 border border-slate-200 rounded-xl">
                                        <table className="w-full text-sm text-left">
                                            <thead className="bg-slate-100 text-slate-600 text-[10px] uppercase font-bold sticky top-0 z-10 shadow-sm">
                                                <tr><th className="p-3">N° Exp / Cliente</th><th className="p-3">Categorización / Titular</th><th className="p-3">Ubicación Física</th><th className="p-3">Acciones</th></tr>
                                            </thead>
                                            <tbody>
                                                {expedientes.map(e => {
                                                    const isEditing = puedeEditarBase && editMode && editMode.id === e.id;
                                                    return (
                                                    <tr key={e.id} className="border-b hover:bg-slate-50">
                                                        <td className="p-3">
                                                            {isEditing ? (
                                                                <input type="text" value={editMode.nuevoCliente} onChange={evt => setEditMode({...editMode, nuevoCliente: evt.target.value.toUpperCase()})} className="border p-1.5 rounded text-xs font-bold w-full uppercase mb-1" />
                                                            ) : (
                                                                <p className="font-bold text-slate-800 text-xs">{e.cliente}</p>
                                                            )}
                                                            <p className="text-[10px] text-blue-600 font-black">Exp: {e.id}</p>
                                                        </td>
                                                        <td className="p-3">
                                                            {isEditing ? (
                                                                <div className="space-y-1">
                                                                    <select value={editMode.nuevoEstado} onChange={evt => setEditMode({...editMode, nuevoEstado: evt.target.value})} className="text-[10px] border p-1 rounded w-full font-bold">
                                                                        {estadosDisponibles.map(est => <option key={est} value={est}>{est}</option>)}
                                                                    </select>
                                                                    <select value={editMode.nuevoAsesor} onChange={evt => setEditMode({...editMode, nuevoAsesor: evt.target.value})} className="text-[10px] border p-1 rounded w-full">
                                                                        {asesores.map(a => <option key={a} value={a}>{a}</option>)}
                                                                    </select>
                                                                    <input type="text" value={editMode.nuevaCatExtra} onChange={evt => setEditMode({...editMode, nuevaCatExtra: evt.target.value})} placeholder="Subcategoría..." className="text-[10px] border p-1 rounded w-full uppercase" />
                                                                </div>
                                                            ) : (
                                                                <>
                                                                    <BadgeEstado estado={e.estadoCredito} />
                                                                    {e.categoriaExtra && <span className="ml-1 text-[9px] bg-slate-200 px-1.5 py-0.5 rounded font-bold">{e.categoriaExtra}</span>}
                                                                    <p className="text-[10px] font-semibold mt-1 text-slate-600">Titular: {e.asesorTitular}</p>
                                                                </>
                                                            )}
                                                        </td>
                                                        <td className="p-3">
                                                            {isEditing ? (
                                                                <select value={editMode.nuevaUbicacion} onChange={evt => setEditMode({...editMode, nuevaUbicacion: evt.target.value})} className="text-[10px] border p-1 rounded w-full font-bold">
                                                                    {ubicacionesDisponibles.map(ub => <option key={ub} value={ub}>{ub}</option>)}
                                                                    {asesores.map(a => <option key={`as-${a}`} value={`CON ASESOR: ${a}`}>{`CON ASESOR: ${a}`}</option>)}
                                                                </select>
                                                            ) : (
                                                                <>
                                                                    <p className={`text-[10px] font-bold ${e.ubicacionFisica.includes('CAJA') ? 'text-green-600' : 'text-red-500'}`}>{e.ubicacionFisica}</p>
                                                                    <p className="text-[9px] text-slate-400 mt-1">{e.fechaUltimoMov}</p>
                                                                </>
                                                            )}
                                                        </td>
                                                        <td className="p-3">
                                                            {isEditing ? (
                                                                <div className="flex gap-1 flex-col sm:flex-row">
                                                                    <button onClick={() => guardarEdicionGerencial(e)} className="bg-[#59B447] text-white px-2.5 py-1 rounded text-[10px] font-bold">Guardar</button>
                                                                    <button onClick={() => setEditMode(null)} className="bg-slate-300 text-slate-700 px-2.5 py-1 rounded text-[10px] font-bold">Cancelar</button>
                                                                </div>
                                                            ) : (
                                                                <div className="flex gap-1 flex-col">
                                                                    {puedeEditarBase && (
                                                                        <button onClick={() => setEditMode({
                                                                            id: e.id,
                                                                            nuevoCliente: e.cliente,
                                                                            nuevoEstado: e.estadoCredito,
                                                                            nuevoAsesor: e.asesorTitular,
                                                                            nuevaUbicacion: e.ubicacionFisica,
                                                                            nuevaCatExtra: e.categoriaExtra || ''
                                                                        })} className="bg-slate-100 text-slate-700 border border-slate-300 px-2 py-1 rounded text-[10px] font-bold hover:bg-slate-200">
                                                                            <i className="fa-solid fa-pen"></i> Editar
                                                                        </button>
                                                                    )}
                                                                    <button onClick={() => setHistorialVisible(e)} className="bg-blue-50 text-blue-700 border border-blue-200 px-2 py-1 rounded text-[10px] font-bold hover:bg-blue-100">
                                                                        <i className="fa-solid fa-clock-rotate-left"></i> Historial
                                                                    </button>
                                                                </div>
                                                            )}
                                                        </td>
                                                    </tr>
                                                )})}
                                                {expedientes.length === 0 && <tr><td colSpan="4" className="text-center p-8 text-slate-400">Sin datos.</td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ===================================================================== */}
                        {/* 5. GENERADOR MASIVO DE TICKETS QR FÍSICOS A4 (CAJEROS Y GERENTES)     */}
                        {/* ===================================================================== */}
                        {view === 'tickets' && puedeOperarCaja && (
                            <div className="animate-fade-in">
                                <div className="no-print grid grid-cols-1 lg:grid-cols-3 gap-4 mb-4">
                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                        <h3 className="font-bold text-slate-800 text-sm mb-2"><i className="fa-solid fa-database text-[#59B447] mr-1"></i> 1. Generar Cientos desde Base ({expedientes.length})</h3>
                                        <div className="flex gap-2 mb-2">
                                            <input type="text" placeholder="Desde Exp (Ej. 1)" value={rangoDesde} onChange={e=>setRangoDesde(e.target.value)} className="w-1/2 p-2 border rounded-lg text-xs font-bold" />
                                            <input type="text" placeholder="Hasta Exp (Ej. 300)" value={rangoHasta} onChange={e=>setRangoHasta(e.target.value)} className="w-1/2 p-2 border rounded-lg text-xs font-bold" />
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => cargarTicketsDesdeBase(true)} className="flex-1 bg-slate-800 text-white py-2 rounded-lg text-xs font-bold hover:bg-slate-700">Cargar Rango</button>
                                            <button onClick={() => cargarTicketsDesdeBase(false)} className="flex-1 bg-[#59B447] text-white py-2 rounded-lg text-xs font-bold hover:bg-green-600">Cargar Todos ({expedientes.length})</button>
                                        </div>
                                    </div>

                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                        <h3 className="font-bold text-slate-800 text-sm mb-2"><i className="fa-solid fa-file-excel text-emerald-600 mr-1"></i> 2. Pegado Masivo desde Excel</h3>
                                        <textarea rows="2" value={excelPasteText} onChange={e=>setExcelPasteText(e.target.value)} placeholder="Pega aquí las columnas N° Exp y Nombre desde Excel..." className="w-full p-2 border rounded-lg text-xs font-mono mb-2"></textarea>
                                        <button onClick={procesarPegadoMasivoExcel} className="w-full bg-emerald-600 text-white py-2 rounded-lg text-xs font-bold hover:bg-emerald-700">Generar Lote QR</button>
                                    </div>

                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                        <h3 className="font-bold text-slate-800 text-sm mb-2"><i className="fa-solid fa-keyboard text-blue-500 mr-1"></i> 3. Ticket Individual (Reimpresión)</h3>
                                        <form onSubmit={agregarTicketManual} className="space-y-2">
                                            <div className="flex gap-2">
                                                <input type="text" placeholder="N° Exp (124)" value={manualId} onChange={e=>setManualId(e.target.value.replace(/\D/g, ''))} className="w-1/3 p-2 border rounded-lg text-xs font-bold" required />
                                                <input type="text" placeholder="Nombre Cliente" value={manualCliente} onChange={e=>setManualCliente(e.target.value.toUpperCase())} className="w-2/3 p-2 border rounded-lg text-xs font-bold" required />
                                            </div>
                                            <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded-lg font-bold text-xs hover:bg-blue-700"><i className="fa-solid fa-plus"></i> Añadir a Cola</button>
                                        </form>
                                    </div>
                                </div>

                                <div className="no-print mb-4 flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200 gap-4">
                                    <div><h2 className="text-xl font-bold text-slate-800"><i className="fa-solid fa-print text-[#59B447]"></i> Vista Previa (A4 - 4x6 con QR)</h2><p className="text-sm text-slate-500">Etiquetas en cola: <span className="font-bold text-blue-600">{ticketsQueue.length}</span></p></div>
                                    <div className="flex gap-2 w-full md:w-auto">
                                        <button onClick={() => { if(confirm("¿Vaciar todas las etiquetas en cola?")) setTicketsQueue([]); }} className="bg-red-50 text-red-600 px-4 py-2.5 rounded-lg font-bold hover:bg-red-100 flex-1 sm:flex-none text-sm">Vaciar Todo</button>
                                        <button onClick={() => window.print()} className="bg-slate-800 text-white px-6 py-2.5 rounded-lg font-bold shadow-md hover:bg-slate-700 flex-1 sm:flex-none text-sm">Imprimir A4 Ahora</button>
                                    </div>
                                </div>

                                <div className="print-container w-full flex flex-col items-center">
                                    {printPages.map((page, pageIdx) => (
                                        <div key={pageIdx} className="print-area bg-white mx-auto w-full mb-8" style={{ pageBreakAfter: pageIdx === printPages.length - 1 ? 'auto' : 'always' }}>
                                            <div className="grid grid-cols-4 w-full border-t-2 border-l-2 border-black">
                                                {page.map((t, idx) => {
                                                    if (t.isEmpty) return ( <div key={`empty-${idx}`} className="ticket-cell flex flex-col border-r-2 border-b-2 border-black bg-white box-border" style={{ height: '40mm' }}><div className="w-full bg-white border-b-2 border-black shrink-0" style={{ height: '4.5mm' }}></div><div className="flex-1 w-full bg-transparent"></div><div className="w-full bg-slate-50/30 border-t-2 border-black shrink-0" style={{ height: '14.5mm' }}></div></div> );
                                                    const nombres = parseTicketName(t.cliente);
                                                    const qrValue = `${t.sede || sedeActual}|${t.id}|${t.cliente}`;
                                                    return (
                                                    <div key={idx} className="ticket-cell flex flex-col border-r-2 border-b-2 border-black bg-white box-border overflow-hidden justify-between" style={{ height: '40mm' }}>
                                                        <div className="w-full bg-white border-b-2 border-black shrink-0 flex items-center justify-between px-1.5" style={{ height: '4.5mm' }}>
                                                            <span className="text-[8px] font-black text-slate-700">{t.sede || sedeActual}</span>
                                                            <span className="text-[8px] font-bold text-slate-400">CREDIBAN</span>
                                                        </div>
                                                        <div className="flex-1 w-full flex items-center justify-between px-1.5 py-0.5 overflow-hidden gap-1">
                                                            <div className="flex-1 flex flex-col items-center justify-center overflow-hidden">
                                                                <span className={`font-black text-black uppercase text-center w-full leading-[1.05] break-words whitespace-normal ${getTicketNameStyle(t.cliente)}`} style={{ fontFamily: 'Arial, sans-serif' }}>{nombres.part1}</span>
                                                                {nombres.part2 && ( <span className={`font-extrabold text-black uppercase text-center w-full leading-[1.05] break-words whitespace-normal ${getTicketNameStyle(t.cliente)}`} style={{ fontFamily: 'Arial, sans-serif' }}>{nombres.part2}</span> )}
                                                            </div>
                                                            <div className="shrink-0 flex items-center justify-center p-0.5 bg-white">
                                                                <QRCodeCanvas value={qrValue} size={54} />
                                                            </div>
                                                        </div>
                                                        <div className="w-full flex items-center justify-center bg-white border-t-2 border-black pb-0.5 shrink-0" style={{ height: '13.5mm' }}>
                                                            <span className="font-black text-[26px] text-red-600 tracking-tighter font-sans" style={{ lineHeight: '1', textShadow: '0px 0px 0px #dc2626' }}>{t.id}</span>
                                                        </div>
                                                    </div>
                                                )})}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* ===================================================================== */}
                        {/* 6. PANEL GERENCIAL DE PARÁMETROS, CATEGORÍAS Y SYNC DE USUARIOS       */}
                        {/* ===================================================================== */}
                        {view === 'parametros' && esGerente && (
                            <div className="animate-fade-in max-w-5xl mx-auto space-y-6 no-print">
                                <div className="bg-slate-900 text-white p-6 rounded-2xl shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <h2 className="text-lg font-black text-[#59B447] uppercase"><i className="fa-solid fa-users-rays mr-2"></i> Sincronización con Script Maestro de Usuarios</h2>
                                        <p className="text-xs text-slate-300 mt-1">Si agregaste una nueva filial, cajero, administrador o asesor en el Script de Usuarios, sincronízalo aquí en un clic.</p>
                                    </div>
                                    <button onClick={forzarSyncUsuarios} className="bg-[#59B447] text-white font-black px-5 py-3 rounded-xl shadow hover:bg-green-600 text-xs whitespace-nowrap">
                                        <i className="fa-solid fa-rotate mr-1.5"></i> Sincronizar Usuarios y Sedes Ahora
                                    </button>
                                </div>

                                <div className="glass-card p-6 rounded-2xl border-t-4 border-[#59B447]">
                                    <h3 className="font-bold text-slate-800 mb-3">Añadir Nuevo Parámetro o Categorización al Sistema</h3>
                                    <form onSubmit={agregarParametroCloud} className="flex flex-col sm:flex-row gap-3">
                                        <select value={nuevoParamTipo} onChange={e => setNuevoParamTipo(e.target.value)} className="p-3 border rounded-xl bg-slate-50 font-bold text-xs text-slate-700">
                                            <option value="ASESOR">ASESOR DE LA SEDE ({sedeActual})</option>
                                            <option value="ESTADO_CREDITO">CATEGORÍA / ESTADO DE CRÉDITO</option>
                                            <option value="UBICACION">UBICACIÓN FÍSICA / ESTANTE</option>
                                            <option value="SEDE">NUEVA FILIAL / SEDE</option>
                                        </select>
                                        <input type="text" required value={nuevoParamValor} onChange={e => setNuevoParamValor(e.target.value)} placeholder="Escribe el nombre del parámetro..." className="flex-1 p-3 border rounded-xl text-sm font-bold uppercase outline-none focus:ring-2 focus:ring-[#59B447]" />
                                        <button type="submit" className="bg-slate-800 text-white px-6 py-3 rounded-xl font-bold text-xs hover:bg-slate-700">
                                            <i className="fa-solid fa-plus mr-1"></i> Guardar en Nube
                                        </button>
                                    </form>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    {/* Lista de Asesores de la Sede */}
                                    <div className="glass-card p-5 rounded-2xl">
                                        <h4 className="font-bold text-slate-800 text-sm mb-3 border-b pb-2"><i className="fa-solid fa-user-tie text-[#59B447] mr-1"></i> Asesores ({sedeActual})</h4>
                                        <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                                            {asesores.map(a => (
                                                <div key={a} className="flex justify-between items-center p-2.5 bg-white border rounded-xl text-xs font-bold text-slate-700">
                                                    <span>{a}</span>
                                                    <button onClick={() => eliminarParametroCloud('ASESOR', a)} className="text-red-500 hover:bg-red-50 px-2 py-1 rounded"><i className="fa-solid fa-trash-can"></i></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Categorizaciones / Estados de Crédito */}
                                    <div className="glass-card p-5 rounded-2xl">
                                        <h4 className="font-bold text-slate-800 text-sm mb-3 border-b pb-2"><i className="fa-solid fa-tags text-blue-500 mr-1"></i> Categorías de Estado</h4>
                                        <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                                            {estadosDisponibles.map(est => (
                                                <div key={est} className="flex justify-between items-center p-2.5 bg-white border rounded-xl text-xs font-bold text-slate-700">
                                                    <BadgeEstado estado={est} />
                                                    <button onClick={() => eliminarParametroCloud('ESTADO_CREDITO', est)} className="text-red-500 hover:bg-red-50 px-2 py-1 rounded"><i className="fa-solid fa-trash-can"></i></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Filiales / Sedes Activas */}
                                    <div className="glass-card p-5 rounded-2xl">
                                        <h4 className="font-bold text-slate-800 text-sm mb-3 border-b pb-2"><i className="fa-solid fa-building text-purple-600 mr-1"></i> Filiales Activas</h4>
                                        <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                                            {sedesDisponibles.map(s => (
                                                <div key={s} className="flex justify-between items-center p-2.5 bg-white border rounded-xl text-xs font-bold text-slate-700">
                                                    <span><i className="fa-solid fa-location-dot text-slate-400 mr-1.5"></i> {s}</span>
                                                    <span className="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full">ACTIVA</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
